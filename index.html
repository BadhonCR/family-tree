<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#fff;
    padding:35px;
    border-radius:12px;
    width:350px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#error{
    color:red;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="box">
    <h2>🔒 Protected Website</h2>

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="checkPassword()">Login</button>

    <p id="error"></p>
</div>

<script>

const correctPassword = "Badhon123"; // এখানে নিজের পাসওয়ার্ড দিন

function checkPassword(){

    const input = document.getElementById("password").value;

    if(input === correctPassword){

        window.location.href = "home.html";

    }else{

        document.getElementById("error").innerHTML = "❌ Incorrect Password";

    }

}

</script>

</body>
</html>
