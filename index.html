<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Tree – Protected</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 16px;
            width: 380px;
            max-width: 94%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .box .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .box h2 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .box p.sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .box input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.25s;
            outline: none;
        }

        .box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .box button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .box button:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }

        #error {
            color: #dc2626;
            margin-top: 16px;
            font-size: 15px;
            min-height: 24px;
        }

        .box .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="icon">🔒</div>
        <h2>Family Tree</h2>
        <p class="sub">Enter the password to view our family history</p>

        <input type="password" id="password" placeholder="Enter Password" autofocus />

        <button onclick="checkPassword()">Unlock</button>

        <p id="error"></p>
        <p class="footer-note">✨ Preserving generations &amp; memories</p>
    </div>

    <script>
        const correctPassword = "Badhon123";

        function checkPassword() {
            const input = document.getElementById("password").value;
            const errorEl = document.getElementById("error");

            if (input === correctPassword) {
                window.location.href = "home.html";
            } else {
                errorEl.innerHTML = "❌ Incorrect password. Try again.";
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }

        // Allow Enter key to submit
        document.getElementById("password").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
