@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:
 radial-gradient(circle at 15% 10%,rgba(0,204,255,.10),transparent 30%),

 color:#edf8ff;font-family:"Noto Sans Bengali",Inter,sans-serif}

 backdrop-filter:blur(18px);border-bottom:1px solid var(--line);pointer-events:auto}

 background:linear-gradient(145deg,rgba(0,204,255,.18),rgba(57,217,138,.12));border:1px solid rgba(0,204,255,.25)}

.overlay-card{position:fixed;z-index:20;left:22px;bottom:22px;width:min(410px,calc(100vw - 44px));
 padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(7,20,31,.58);
 backdrop-filter:blur(15px);box-shadow:0 20px 60px rgba(0,0,0,.28);pointer-events:none}
.kicker{font:700 10px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan2)}
.overlay-card h1{margin:7px 0 6px;font-size:25px;line-height:1.2}
.overlay-card p{margin:0;color:#91a9b8;font-size:13px;line-height:1.7}
.controls{position:fixed;right:22px;bottom:22px;z-index:30;display:flex;gap:8px}
.control-btn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(0,204,255,.22);
 background:rgba(7,20,31,.70);color:var(--cyan2);backdrop-filter:blur(12px);cursor:pointer;font-size:17px;
 box-shadow:0 8px 25px rgba(0,0,0,.25);transition:.2s}
.control-btn:hover{background:rgba(0,204,255,.12);transform:translateY(-2px)}
.hint{position:fixed;right:22px;top:96px;z-index:20;padding:9px 12px;border-radius:12px;
 border:1px solid var(--line);background:rgba(7,20,31,.48);backdrop-filter:blur(10px);
 color:#7892a1;font:500 10px Inter,sans-serif;pointer-events:none}
#app-loading{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#07141f;
 color:var(--cyan);font-size:14px;font-weight:600}
.spinner{width:42px;height:42px;border:3px solid rgba(0,204,255,.15);border-top-color:var(--cyan);
 border-radius:50%;animation:spin .9s linear infinite;margin:auto auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){
 .nav{height:68px} .nav-inner{padding:0 16px} .nav-links{display:none;position:absolute;left:14px;right:14px;top:74px;
 flex-direction:column;align-items:stretch;padding:10px;background:rgba(7,20,31,.97);border:1px solid var(--line);
 border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
 .nav-links.open{display:flex} .nav-links a{padding:13px 14px} .menu{display:block}
 .overlay-card{left:14px;bottom:14px;width:calc(100vw - 28px);padding:16px}
 .overlay-card h1{font-size:21px} .overlay-card p{font-size:12px}
 .controls{right:14px;bottom:142px} .hint{right:14px;top:82px;font-size:9px}
}
@media(max-width:480px){
 .brand-title{font-size:14px} .brand-sub{font-size:9px} .hint{display:none}
}

 <div class="kicker">3D GENOGRAM</div>
 <h1>পরিবারকে দেখুন একটি নতুন মাত্রায়</h1>
 <p>ইন্টারেক্টিভ ৩ডি বংশবৃক্ষ—মাউস বা স্পর্শে ঘুরিয়ে দেখুন এবং স্ক্রল করে কাছে বা দূরে যান।</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
<script>
const importedMembersData = window.__membersData || null;
</script>
<script>
/* The 3D engine below is derived from the supplied test.html model.
   A small module bridge is installed below so the existing non-module
   Three.js code can consume membersData.js. */
</script>
<script type="module">
import { membersData } from './js/membersData.js';
window.__membersData = membersData;
window.dispatchEvent(new CustomEvent('members-data-ready'));
</script>
<script>
let booted = false;
function boot3D() {
 if (booted || !window.__membersData || typeof THREE === 'undefined') return;
 booted = true;
 const importedMembersData = window.__membersData;
 const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isLowPowerDevice ? 1.5 : 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        let isAnimating = true;
        let isMarbleSelected = false;

        const defaultCameraPos = new THREE.Vector3(0, 0, 40);
        camera.position.copy(defaultCameraPos);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const geometry = new THREE.SphereGeometry(1, isLowPowerDevice ? 20 : 48, isLowPowerDevice ? 20 : 48);
        const clickableMarbles = [];
        const marbleMap = {};

        function createMarbleMaterial(colorValue) {
            return new THREE.MeshPhongMaterial({ 
                color: colorValue, 
                shininess: 100,
                transparent: true,
                opacity: 1
            });
        }

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 128;
            context.font = 'Bold 40px "Segoe UI", sans-serif';
            context.fillStyle = '#ffffff';
            context.textAlign = 'center';
            context.fillText(text, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(2, 1, 1);
            sprite.position.set(0, 1.4, 0);
            return sprite;
        }

        // ALL MEMBERS DATA
        const membersData = importedMembersData;

        function calculateGenerations() {
            const memberDict = {};
            membersData.forEach(m => { memberDict[m.uid] = m; });

            function getPaternalGen(uid, visited = new Set()) {
                if (visited.has(uid)) return 1;
                visited.add(uid);
                const m = memberDict[uid];
                if (!m) return 1;

                if (m.father) return getPaternalGen(m.father, new Set(visited)) + 1;
                if (m.spouse) {
                    const spouseUid = Array.isArray(m.spouse) ? m.spouse[0] : m.spouse;
                    if (memberDict[spouseUid] && memberDict[spouseUid].father) return getPaternalGen(spouseUid, new Set(visited));
                }
                return 1;
            }

            function getMaternalGen(uid, visited = new Set()) {
                if (visited.has(uid)) return 1;
                visited.add(uid);
                const m = memberDict[uid];
                if (!m) return 1;

                if (m.mother) return getMaternalGen(m.mother, new Set(visited)) + 1;
                if (m.spouse) {
                    const spouseUid = Array.isArray(m.spouse) ? m.spouse[0] : m.spouse;
                    if (memberDict[spouseUid] && memberDict[spouseUid].mother) return getMaternalGen(spouseUid, new Set(visited));
                }
                return 1;
            }

            membersData.forEach(m => {
                m.patrilinealGen = getPaternalGen(m.uid);
                m.matrilinealGen = getMaternalGen(m.uid);
                m.generation = Math.max(m.patrilinealGen, m.matrilinealGen);
            });
        }

        calculateGenerations();

        function initializeStatsAndOptions() {
            const total = membersData.length;
            let males = 0;
            let females = 0;
            const marriedCouples = new Set();
            const genCounts = {};

            membersData.forEach((m) => {
                if (m.gender.includes('Male') || m.gender.includes('পুরুষ') || m.gender === 'M') males++;
                else if (m.gender.includes('Female') || m.gender.includes('মহিলা') || m.gender === 'F') females++;

                if (m.spouse) {
                    const spouses = Array.isArray(m.spouse) ? m.spouse : [m.spouse];
                    spouses.forEach(sUid => {
                        const pair = [m.uid, sUid].sort().join('-');
                        marriedCouples.add(pair);
                    });
                }

                let gen = m.patrilinealGen;
                genCounts[gen] = (genCounts[gen] || 0) + 1;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-male').innerText = males;
            document.getElementById('stat-female').innerText = females;
            document.getElementById('stat-families').innerText = marriedCouples.size;

            const genContainer = document.getElementById('generation-container');
            genContainer.innerHTML = '';

            const galleryFilter = document.getElementById('gallery-gen-filter');
            galleryFilter.innerHTML = '<option value="all">সকল জেনারেশন</option>';
            
            const genKeys = Object.keys(genCounts).sort((a,b) => a - b);
            genKeys.forEach(g => {
                const div = document.createElement('div');
                div.className = 'gen-item';
                div.onclick = () => showFilteredMemberList('gen-' + g, `পিতৃকুল জেনারেশন ${g} এর সদস্যগণ`);
                div.innerHTML = `
                    <span class="gen-title">পিতৃকুল জেনারেশন ${g}</span>
                    <span class="gen-count">${genCounts[g]} জন</span>
                `;
                genContainer.appendChild(div);

                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = `জেনারেশন ${g}`;
                galleryFilter.appendChild(opt);
            });
        }

        // AUTO-SEARCH DROPDOWN LOGIC FOR RELATIVE & BLOODLINE TABS
        function autoSearchPerson(targetType) {
            let inputId, hiddenId, dropdownId;
            if (targetType === 'a') { inputId = 'rel-input-a'; hiddenId = 'rel-person-a'; dropdownId = 'dropdown-a'; }
            else if (targetType === 'b') { inputId = 'rel-input-b'; hiddenId = 'rel-person-b'; dropdownId = 'dropdown-b'; }
            else if (targetType === 'blood') { inputId = 'bloodline-input'; hiddenId = 'bloodline-person'; dropdownId = 'dropdown-blood'; }

            const val = document.getElementById(inputId).value.trim().toLowerCase();
            const dropdown = document.getElementById(dropdownId);

            if (!val) {
                dropdown.style.display = 'none';
                document.getElementById(hiddenId).value = '';
                return;
            }

            const matches = membersData.filter(m => 
                m.bnName.toLowerCase().includes(val) ||
                m.enName.toLowerCase().includes(val) ||
                m.nick.toLowerCase().includes(val) ||
                m.uid.toLowerCase().includes(val)
            );

            dropdown.innerHTML = '';
            if (matches.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';

                const img = document.createElement('img');
                img.className = 'avatar-thumb';
                img.loading = 'lazy';
                loadProfilePhoto(img, m.uid);

                const span = document.createElement('span');
                span.innerHTML = `<b>${m.bnName}</b> (${m.nick}) <small style="color:#00ffff">${m.uid}</small>`;

                div.appendChild(img);
                div.appendChild(span);

                div.onclick = () => {
                    document.getElementById(inputId).value = `${m.bnName} (${m.nick})`;
                    document.getElementById(hiddenId).value = m.uid;
                    dropdown.style.display = 'none';

                    if (targetType === 'a' || targetType === 'b') calculateRelationship();
                    else if (targetType === 'blood') calculateBloodline();
                };
                dropdown.appendChild(div);
            });

            dropdown.style.display = 'block';
        }

        // GALLERY FEATURE
        function renderGallery() {
            const filterVal = document.getElementById('gallery-gen-filter').value;
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            const list = filterVal === 'all' ? membersData : membersData.filter(m => m.patrilinealGen == filterVal);

            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                
                const img = document.createElement('img');
                img.className = 'gallery-img';
                img.loading = 'lazy';
                
                let candidates = [
                    `images/${m.uid}.jpg`,
                    `images/${m.uid}.jpeg`,
                    `images/${m.uid}.png`,
                    `images/${m.uid} 01.jpg`
                ];
                let idx = 0;

                function tryNextImage() {
                    if (idx >= candidates.length) {
                        card.style.display = 'none';
                        return;
                    }
                    img.src = candidates[idx++];
                }

                img.onerror = tryNextImage;
                tryNextImage();

                const name = document.createElement('div');
                name.className = 'gallery-name';
                name.innerText = m.bnName;

                card.appendChild(img);
                card.appendChild(name);
                card.onclick = () => { focusByUid(m.uid); };

                grid.appendChild(card);
            });
        }

        // QUIZ FEATURE
        let currentQuizAnswer = null;
        function startNewQuiz() {
            const quizImg = document.getElementById('quiz-photo');
            const optionsDiv = document.getElementById('quiz-options');
            const feedback = document.getElementById('quiz-feedback');
            feedback.innerText = '';
            optionsDiv.innerHTML = '';

            let availableMembers = [...membersData].sort(() => Math.random() - 0.5);

            function tryQuizWithMember(index) {
                if (index >= availableMembers.length) {
                    feedback.innerText = '⚠️ ছবিযুক্ত কোনো সদস্য পাওয়া যায়নি।';
                    quizImg.style.display = 'none';
                    return;
                }

                const target = availableMembers[index];
                let candidates = [
                    `images/${target.uid}.jpg`,
                    `images/${target.uid}.jpeg`,
                    `images/${target.uid}.png`,
                    `images/${target.uid} 01.jpg`
                ];
                let imgIdx = 0;

                function checkNextImage() {
                    if (imgIdx >= candidates.length) {
                        tryQuizWithMember(index + 1);
                        return;
                    }
                    quizImg.src = candidates[imgIdx++];
                }

                quizImg.onerror = checkNextImage;
                quizImg.onload = () => {
                    quizImg.style.display = 'block';
                    currentQuizAnswer = target.uid;

                    const choices = [target];
                    while (choices.length < 4 && choices.length < membersData.length) {
                        const rand = membersData[Math.floor(Math.random() * membersData.length)];
                        if (!choices.includes(rand)) choices.push(rand);
                    }
                    choices.sort(() => Math.random() - 0.5);

                    optionsDiv.innerHTML = '';
                    choices.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'quiz-btn';
                        btn.innerText = `${opt.bnName} (${opt.nick})`;
                        btn.onclick = () => {
                            if (opt.uid === currentQuizAnswer) {
                                feedback.innerText = '✅ সঠিক উত্তর!';
                                feedback.style.color = '#00ffcc';
                            } else {
                                feedback.innerText = `❌ ভুল! সঠিক: ${target.bnName}`;
                                feedback.style.color = '#ff4757';
                            }
                        };
                        optionsDiv.appendChild(btn);
                    });
                };

                checkNextImage();
            }

            tryQuizWithMember(0);
        }

        membersData.forEach(data => {
            const marble = new THREE.Mesh(geometry, createMarbleMaterial(data.color));
            marble.userData = data;
            marble.add(createTextSprite(data.nick));
            scene.add(marble);
            clickableMarbles.push(marble);
            marbleMap[data.uid] = marble;
        });

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.5, transparent: true });
        function createThread(p1, p2) {
            const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const line = new THREE.Line(geom, lineMaterial.clone());
            scene.add(line);
            return line;
        }

        const connectionsData = [];
        membersData.forEach(m => {
            if (m.spouse) {
                const spouses = Array.isArray(m.spouse) ? m.spouse : [m.spouse];
                spouses.forEach(sUid => {
                    if (marbleMap[sUid]) connectionsData.push([m.uid, sUid]);
                });
            }
            if (m.father && marbleMap[m.father]) {
                connectionsData.push([m.uid, m.father]);
            }
            if (m.mother && marbleMap[m.mother]) {
                connectionsData.push([m.uid, m.mother]);
            }
        });

        const connections = [];
        connectionsData.forEach(pair => {
            if (marbleMap[pair[0]] && marbleMap[pair[1]]) {
                connections.push([marbleMap[pair[0]], marbleMap[pair[1]]]);
            }
        });

        const threads = connections.map(pair => createThread(pair[0].position, pair[1].position));

        let angle = 0;
        function animate(time) {
            requestAnimationFrame(animate);

            if (is2DViewActive()) return;

            TWEEN.update(time);

            if (isAnimating) {
                angle += 0.002;

                const genGroups = {};
                membersData.forEach(m => {
                    if (!genGroups[m.patrilinealGen]) genGroups[m.patrilinealGen] = [];
                    genGroups[m.patrilinealGen].push(m.uid);
                });

                Object.keys(genGroups).forEach(genStr => {
                    const gen = parseInt(genStr);
                    const list = genGroups[genStr];
                    const radius = 8 + (gen * 5);
                    const height = 22 - (gen * 7);

                    list.forEach((uid, idx) => {
                        const itemAngle = angle * (1 + gen * 0.08) + (idx * (Math.PI * 2 / list.length));
                        if (marbleMap[uid]) {
                            marbleMap[uid].position.set(
                                Math.cos(itemAngle) * radius,
                                height,
                                Math.sin(itemAngle) * radius
                            );
                        }
                    });
                });

                clickableMarbles.forEach(m => m.rotation.y += 0.01);
            }

            threads.forEach((thread, index) => {
                const points = [connections[index][0].position, connections[index][1].position];
                thread.geometry.setFromPoints(points);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        initializeStatsAndOptions();

        const loadingEl = document.getElementById('app-loading');
        if (loadingEl) {
            loadingEl.style.opacity = '0';
            setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
        }

        let currentZoom = 1;
        function zoomTree(delta) {
            currentZoom = Math.max(0.4, Math.min(2.2, currentZoom + delta));
            document.getElementById('tree-2d-view').style.transform = `scale(${currentZoom})`;
            setTimeout(drawSvgConnections, 100);
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('tree-2d-view').style.transform = `scale(1)`;
            setTimeout(drawSvgConnections, 100);
        }

        window.addEventListener('beforeprint', () => {
            drawSvgConnections();
        });
        window.addEventListener('afterprint', () => {
            drawSvgConnections();
        });

        function setExportButtonsBusy(busy) {
            ['export-png-btn', 'export-svg-btn', 'export-pdf-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = busy;
            });
        }

        function getExportFilename(ext) {
            const hiddenInput = document.getElementById('bloodline-person');
            const uid = hiddenInput ? hiddenInput.value : '';
            const m = membersData.find(x => x.uid === uid);
            const label = m ? m.bnName.replace(/[^\w\u0980-\u09FF]+/g, '_') : 'bloodline-tree';
            return `${label}.${ext}`;
        }

        async function renderTreeToCanvas() {
            const wrapper = document.getElementById('tree-2d-view');
            if (typeof html2canvas === 'undefined') {
                alert('এক্সপোর্ট লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
                return null;
            }
            const savedZoom = currentZoom;
            wrapper.style.transform = 'scale(1)';
            drawSvgConnections();
            await new Promise(r => setTimeout(r, 60));

            const naturalW = wrapper.scrollWidth;
            const naturalH = wrapper.scrollHeight;
            const MAX_DIMENSION = 8000;
            let scale = 2;
            if (Math.max(naturalW, naturalH) * scale > MAX_DIMENSION) {
                scale = Math.max(1, MAX_DIMENSION / Math.max(naturalW, naturalH));
            }

            const canvas = await html2canvas(wrapper, {
                backgroundColor: '#0f172a',
                scale: scale,
                useCORS: true,
                logging: false
            });

            wrapper.style.transform = `scale(${savedZoom})`;
            drawSvgConnections();

            return canvas;
        }

        async function exportTreeAsPNG() {
            if (!is2DViewActive()) {
                alert('প্রথমে "ব্লাডলাইন" ট্যাব থেকে একজন ব্যক্তি নির্বাচন করুন।');
                return;
            }
            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = getExportFilename('png');
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error(err);
                alert('PNG এক্সপোর্ট ব্যর্থ হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        async function exportTreeAsPDF() {
            if (!is2DViewActive()) {
                alert('প্রথমে "ব্লাডলাইন" ট্যাব থেকে একজন ব্যক্তি নির্বাচন করুন।');
                return;
            }
            if (typeof window.jspdf === 'undefined') {
                alert('PDF লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
                return;
            }
            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;

                const { jsPDF } = window.jspdf;
                const imgData = canvas.toDataURL('image/png');
                const isLandscape = canvas.width >= canvas.height;
                const pdf = new jsPDF({
                    orientation: isLandscape ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save(getExportFilename('pdf'));
            } catch (err) {
                console.error(err);
                alert('PDF এক্সপোর্ট ব্যর্থ হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        async function exportTreeAsSVG() {
            if (!is2DViewActive()) {
                alert('প্রথমে "ব্লাডলাইন" ট্যাব থেকে একজন ব্যক্তি নির্বাচন করুন।');
                return;
            }
            setExportButtonsBusy(true);
            try {
                const wrapper = document.getElementById('tree-2d-view');
                const savedZoom = currentZoom;
                wrapper.style.transform = 'scale(1)';
                drawSvgConnections();
                await new Promise(r => setTimeout(r, 60));

                const width = wrapper.scrollWidth;
                const height = wrapper.scrollHeight;

                let styleText = '';
                document.querySelectorAll('style').forEach(s => { styleText += s.textContent + '\n'; });

                const clone = wrapper.cloneNode(true);
                clone.style.transform = 'none';

                const svgNS = 'http://www.w3.org/2000/svg';
                const svgRoot = document.createElementNS(svgNS, 'svg');
                svgRoot.setAttribute('xmlns', svgNS);
                svgRoot.setAttribute('width', width);
                svgRoot.setAttribute('height', height);
                svgRoot.setAttribute('viewBox', `0 0 ${width} ${height}`);

                const bg = document.createElementNS(svgNS, 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', '#0f172a');
                svgRoot.appendChild(bg);

                const styleEl = document.createElementNS(svgNS, 'style');
                styleEl.textContent = styleText;
                svgRoot.appendChild(styleEl);

                const fo = document.createElementNS(svgNS, 'foreignObject');
                fo.setAttribute('x', '0');
                fo.setAttribute('y', '0');
                fo.setAttribute('width', width);
                fo.setAttribute('height', height);
                const foDiv = document.createElement('div');
                foDiv.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                foDiv.appendChild(clone);
                fo.appendChild(foDiv);
                svgRoot.appendChild(fo);

                wrapper.style.transform = `scale(${savedZoom})`;
                drawSvgConnections();

                const serializer = new XMLSerializer();
                const svgString = '<?xml version="1.0" standalone="no"?>\n' + serializer.serializeToString(svgRoot);
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = getExportFilename('svg');
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            } catch (err) {
                console.error(err);
                alert('SVG এক্সপোর্ট ব্যর্থ হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        function drawSvgConnections() {
            const svg = document.getElementById('tree-svg-canvas');
            const wrapper = document.getElementById('tree-2d-view');
            
            if (!svg || !wrapper) return;
            svg.innerHTML = '';
            
            const wRect = wrapper.getBoundingClientRect();
            
            svg.setAttribute('width', wrapper.scrollWidth || wrapper.offsetWidth);
            svg.setAttribute('height', wrapper.scrollHeight || wrapper.offsetHeight);

            const cards = document.querySelectorAll('.couple-node-card');
            cards.forEach(parentCard => {
                const parentId = parentCard.getAttribute('data-family-id');
                const childrenCards = document.querySelectorAll(`.couple-node-card[data-parent-id="${parentId}"]`);

                if (childrenCards.length > 0) {
                    const pRect = parentCard.getBoundingClientRect();
                    
                    const startX = (pRect.left + pRect.width / 2 - wRect.left) / currentZoom;
                    const startY = (pRect.bottom - wRect.top) / currentZoom;

                    childrenCards.forEach(childCard => {
                        const cRect = childCard.getBoundingClientRect();
                        
                        const endX = (cRect.left + cRect.width / 2 - wRect.left) / currentZoom;
                        const endY = (cRect.top - wRect.top) / currentZoom;

                        const midY = startY + (endY - startY) / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`;
                        path.setAttribute('d', d);
                        path.setAttribute('stroke', '#00ffff');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        path.setAttribute('opacity', '0.9');
                        svg.appendChild(path);
                    });
                }
            });
        }

        document.getElementById('tree-viewport').addEventListener('scroll', drawSvgConnections);

        document.getElementById('tree-2d-overlay').addEventListener('click', (e) => {
            if (e.target.closest('.couple-node-card') || e.target.closest('.zoom-controls')) return;
            setViewMode('3d');
        });

        document.getElementById('tree-viewport').addEventListener('wheel', (e) => {
            if (!e.ctrlKey && !e.metaKey) return;
            e.preventDefault();
            zoomTree(e.deltaY < 0 ? 0.1 : -0.1);
        }, { passive: false });

        (function setupPinchZoom() {
            const viewport = document.getElementById('tree-viewport');
            let pinchStartDist = null;
            let pinchStartZoom = 1;

            function touchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            }

            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    pinchStartDist = touchDistance(e.touches);
                    pinchStartZoom = currentZoom;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && pinchStartDist) {
                    e.preventDefault();
                    const newDist = touchDistance(e.touches);
                    const ratio = newDist / pinchStartDist;
                    currentZoom = Math.max(0.4, Math.min(2.2, pinchStartZoom * ratio));
                    document.getElementById('tree-2d-view').style.transform = `scale(${currentZoom})`;
                }
            }, { passive: false });

            viewport.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    pinchStartDist = null;
                    drawSvgConnections();
                }
            }, { passive: true });
        })();


}
window.addEventListener('members-data-ready', boot3D);
window.addEventListener('load', () => setTimeout(boot3D, 100));
document.getElementById('menu').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('open'));
document.querySelectorAll('#navLinks a').forEach(a=>a.addEventListener('click',()=>document.getElementById('navLinks').classList.remove('open')));
</script>
