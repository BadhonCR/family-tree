<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="ইন্টারেক্টিভ ৩ডি ও ২ডি পারিবারিক বংশবৃক্ষ — ফটো গ্যালারি, সম্পর্ক নির্ণয় ও ২ডি জেনোগ্রাম।">
    <title>পারিবারিক বংশবৃক্ষ — জেনোগ্রাম (Genogram)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
        }

        body > canvas {
            touch-action: none;
            transition: opacity 0.45s ease;
        }

        body.mode-2d > canvas {
            opacity: 0;
            pointer-events: none;
        }

        #tree-viewport {
            touch-action: auto;
        }

        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #00ffff;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.4s ease;
        }

        #app-loading .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(0, 255, 255, 0.2);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== TOP NAVBAR (HOME STYLE) ===== */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 10px 18px;
            background: rgba(6, 10, 18, 0.82);
            border-bottom: 1px solid rgba(0, 255, 255, 0.14);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        }

        .nav-inner {
            width: min(1180px, 100%);
            min-height: 58px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: max-content;
            color: inherit;
            text-decoration: none;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 22px;
            background: linear-gradient(145deg, rgba(0, 204, 255, 0.18), rgba(57, 217, 138, 0.12));
            border: 1px solid rgba(0, 204, 255, 0.25);
        }

        .brand-title {
            font-weight: 800;
            line-height: 1.05;
            font-size: 15px;
            color: #fff;
        }

        .brand-sub {
            font: 500 10px Inter, sans-serif;
            letter-spacing: .14em;
            color: #91a9b8;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a {
            padding: 10px 16px;
            border-radius: 12px;
            color: #a9bfcb;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: .2s ease;
        }

        .nav-links a:hover {
            background: rgba(0, 204, 255, 0.09);
            color: #e9fbff;
        }

        .nav-links a.active {
            background: linear-gradient(135deg, rgba(0, 180, 219, 0.92), rgba(0, 131, 176, 0.92));
            color: #fff;
            box-shadow: 0 5px 18px rgba(0, 200, 255, 0.18);
        }

        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 255, 255, 0.06);
            color: #00ffff;
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 820px) {
            .nav-inner { min-height: 52px; }
            .menu-toggle { display: block; }
            .nav-links {
                display: none;
                position: absolute;
                left: 14px;
                right: 14px;
                top: 68px;
                padding: 10px;
                flex-direction: column;
                align-items: stretch;
                background: rgba(7, 20, 31, 0.97);
                border: 1px solid rgba(0, 255, 255, 0.18);
                border-radius: 18px;
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
            }
            .nav-links.open { display: flex; }
            .nav-links a { padding: 12px 14px; }
        }

        /* 2D BLOODLINE / GENOGRAM OVERLAY */
        #tree-2d-overlay {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            z-index: 500;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        body.mode-2d #tree-2d-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .zoom-controls {
            position: absolute;
            top: 85px;
            right: 20px;
            z-index: 600;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .zoom-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .zoom-btn:hover {
            background: rgba(0, 255, 255, 0.25);
            transform: scale(1.08);
        }

        .print-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 0 16px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.4);
            transition: all 0.2s ease;
        }

        .print-btn:hover {
            opacity: 0.9;
            transform: scale(1.04);
        }

        .print-btn:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
        }

        #tree-viewport {
            width: 100%;
            height: 100%;
            overflow: auto;
            position: relative;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 100px 40px 60px 40px;
            box-sizing: border-box;
        }

        #tree-viewport:active {
            cursor: grabbing;
        }

        .tree-2d-wrapper {
            position: relative;
            transform-origin: center top;
            transition: transform 0.15s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 70px;
            min-width: max-content;
            padding: 40px;
        }

        .gen-2d-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .nodes-2d-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            position: relative;
        }

        .couple-node-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.2);
            position: relative;
            z-index: 2;
            transition: all 0.25s ease;
        }

        .couple-node-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 255, 255, 0.4);
            border-color: #ffffff;
        }

        .couple-node-card.root-card {
            border-color: #ffda79;
            box-shadow: 0 0 20px rgba(255, 218, 121, 0.4);
        }

        .person-unit {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .person-unit:hover .card-2d-name {
            color: #00ffff;
        }

        .spouse-unit {
            color: #ff79c6;
        }

        .spouse-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff79c6;
            font-size: 13px;
            font-weight: bold;
            padding: 0 2px;
        }

        .card-2d-name {
            font-weight: 700;
            font-size: 14px;
            color: #f8fafc;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .node-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #00ffff;
            background: #1a2230;
            flex-shrink: 0;
        }

        #tree-svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* POPUP MODAL */
        #popup-modal {
            display: none;
            position: fixed;
            top: 90px;
            right: 20px;
            background: linear-gradient(145deg, rgba(15, 23, 36, 0.96), rgba(8, 14, 24, 0.98));
            color: #e2e8f0;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85), 0 0 15px rgba(0, 255, 255, 0.15);
            z-index: 2500;
            width: 330px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 255, 0.35);
            backdrop-filter: blur(16px);
        }

        .popup-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .popup-header-container h2 {
            margin: 0 0 6px 0;
            color: #00ffff;
            font-size: 19px;
            font-weight: 700;
        }

        .uid-gen-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .uid-badge {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        .gen-badge {
            font-size: 11px;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            font-weight: 600;
        }

        .profile-details-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .profile-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-field.block-field {
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .field-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
        }

        .field-value {
            color: #f8fafc;
            font-weight: 500;
            text-align: right;
        }

        .block-field .field-value {
            text-align: left;
        }

        .profile-img-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #00ffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.25);
            background-color: #1a2230;
            flex-shrink: 0;
        }

        .relation-link {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .relation-link:hover {
            color: #00ffff;
            text-decoration: underline;
        }

        .btn-close {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        #image-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        #image-lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 12px;
            border: 2px solid #00ffff;
        }

        @media print {
            body, html {
                width: 100vw !important;
                height: 100vh !important;
                overflow: hidden !important;
                background: white !important;
                color: black !important;
            }

            canvas, .top-navbar, .zoom-controls, #popup-modal {
                display: none !important;
            }

            #tree-2d-overlay {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: white !important;
                box-sizing: border-box !important;
                padding: 10px !important;
                overflow: hidden !important;
            }

            #tree-viewport {
                width: 100% !important;
                height: 100% !important;
                padding: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .couple-node-card {
                border: 1.5px solid #000 !important;
                background: #ffffff !important;
                box-shadow: none !important;
                color: black !important;
                padding: 6px 14px !important;
            }

            .card-2d-name { color: #000 !important; font-size: 12px !important; }
            .spouse-divider { color: #666 !important; }

            svg path {
                stroke: #0284c7 !important;
                stroke-width: 2px !important;
            }
        }

        @media (max-width: 600px) {
            #popup-modal { 
                width: calc(100% - 32px) !important;
                left: 16px !important; right: 16px !important;
                top: 80px !important;
            }
            .zoom-controls { top: 75px; right: 12px; gap: 6px; }
            .zoom-btn { width: 36px; height: 36px; font-size: 16px; }
            .print-btn { padding: 0 10px; height: 36px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="app-loading" aria-live="polite">
        <div class="spinner"></div>
        <div>৩ডি জেনোগ্রাম মডেল লোড হচ্ছে...</div>
    </div>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="nav-inner">
            <a class="brand" href="home.html" aria-label="Family Archive Home">
                <div class="brand-mark">🌳</div>
                <div>
                    <div class="brand-title">পারিবারিক বংশবৃক্ষ</div>
                    <div class="brand-sub">Family Archive</div>
                </div>
            </a>
            <button class="menu-toggle" id="nav-toggle" aria-label="মেনু" aria-expanded="false">☰</button>
            <nav class="nav-links" id="nav-links" aria-label="প্রধান নেভিগেশন">
                <a href="home.html">Home</a>
                <a href="genogram.html" class="active">Genogram</a>
                <a href="bloodline.html">Bloodline</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <!-- 2D BLOODLINE OVERLAY -->
    <div id="tree-2d-overlay">
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomTree(0.1)" title="Zoom In" aria-label="জুম ইন">➕</button>
            <button class="zoom-btn" onclick="zoomTree(-0.1)" title="Zoom Out" aria-label="জুম আউট">➖</button>
            <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom" aria-label="জুম রিসেট">↺</button>
            <button class="print-btn" id="export-png-btn" onclick="exportTreeAsPNG()" title="PNG হিসেবে ডাউনলোড করুন" aria-label="PNG এক্সপোর্ট">🖼️ <span class="btn-label">PNG</span></button>
            <button class="print-btn" id="export-svg-btn" onclick="exportTreeAsSVG()" title="SVG হিসেবে ডাউনলোড করুন" aria-label="SVG এক্সপোর্ট" style="background: linear-gradient(135deg, #7c3aed, #4c1d95);">🧬 <span class="btn-label">SVG</span></button>
            <button class="print-btn" id="export-pdf-btn" onclick="exportTreeAsPDF()" title="PDF হিসেবে ডাউনলোড করুন" aria-label="PDF এক্সপোর্ট" style="background: linear-gradient(135deg, #dc2626, #7f1d1d);">📄 <span class="btn-label">PDF</span></button>
        </div>

        <div id="tree-viewport">
            <div id="tree-2d-view" class="tree-2d-wrapper">
                <svg id="tree-svg-canvas"></svg>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL -->
    <div id="popup-modal">
        <div class="popup-header-container">
            <div>
                <h2 id="m-bname">প্রোফাইল বিবরণ</h2>
                <div class="uid-gen-wrapper">
                    <span class="uid-badge">UID: <span id="m-uid"></span></span>
                    <span class="gen-badge" id="m-gen"></span>
                </div>
            </div>
            <img id="m-photo" class="profile-img-thumb" src="" alt="Profile Photo" onclick="openLightbox(this.src)">
        </div>

        <div class="profile-details-list">
            <div class="profile-field">
                <span class="field-label">ইংরেজি নাম:</span>
                <span class="field-value" id="m-ename"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">লিঙ্গ:</span>
                <span class="field-value" id="m-gender"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">দ্বৈত জেনারেশন ইনডেক্স:</span>
                <span class="field-value" id="m-dual-gen" style="color: #00ffff; font-weight: bold;"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">দাম্পত্য সঙ্গী:</span>
                <span class="field-value" id="m-spouse"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">পিতার নাম:</span>
                <span class="field-value" id="m-father"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">মাতার নাম:</span>
                <span class="field-value" id="m-mother"></span>
            </div>
            <div class="profile-field block-field">
                <span class="field-label">সন্তানগণ:</span>
                <span class="field-value" id="m-children"></span>
            </div>
            <div class="profile-field block-field" id="desc-container">
                <span class="field-label">বিবরণ:</span>
                <span class="field-value" id="m-desc" style="color: #ffda79;"></span>
            </div>
        </div>

        <button id="close-btn" class="btn-close" style="margin-top:16px; width:100%; padding:9px;" onclick="closePopup()">বন্ধ করুন</button>
    </div>

    <div id="image-lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full View">
    </div>

    <!-- EXTERNAL LIBRARIES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- MAIN 3D MODEL & APP LOGIC -->
    <script type="module">
        import { membersData } from './js/membersData.js';

        if (typeof THREE === 'undefined') {
            const el = document.getElementById('app-loading');
            if (el) {
                el.innerHTML = '<div style="color:#ff6b6b; text-align:center; padding:0 24px; font-size:14px;">⚠️ প্রয়োজনীয় লাইব্রেরি লোড করা যায়নি।<br>ইন্টারনেট সংযোগ পরীক্ষা করে পেজটি রিফ্রেশ করুন।</div>';
            }
            throw new Error('THREE.js failed to load — aborting app init.');
        }

        const DEFAULT_NO_IMAGE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2000ffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/><line x1='3' y1='3' x2='21' y2='21'/></svg>";

        window.loadProfilePhoto = function(imgEl, uid) {
            const candidates = [
                `images/${uid}.jpg`,
                `images/${uid}.jpeg`,
                `images/${uid}.png`,
                `images/${uid} 01.jpg`
            ];
            let i = 0;
            function tryNext() {
                if (i >= candidates.length) {
                    imgEl.onerror = null;
                    imgEl.src = DEFAULT_NO_IMAGE;
                    return;
                }
                imgEl.src = candidates[i++];
            }
            imgEl.onerror = tryNext;
            tryNext();
        };

        window.openLightbox = function(src) {
            if (!src || src.includes("data:image/svg+xml")) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('image-lightbox').style.display = 'flex';
        };

        window.closeLightbox = function() {
            document.getElementById('image-lightbox').style.display = 'none';
        };

        window.is2DViewActive = function() {
            return document.body.classList.contains('mode-2d');
        };

        window.setViewMode = function(mode) {
            document.body.classList.toggle('mode-2d', mode === '2d');
            if (mode === '2d') {
                clearTimeout(window.setViewMode._lineTimer);
                window.setViewMode._lineTimer = setTimeout(drawSvgConnections, 470);
            }
        };

        const isLowPowerDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isLowPowerDevice ? 1.5 : 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        let isAnimating = true;
        let isMarbleSelected = false;

        const defaultCameraPos = new THREE.Vector3(0, 0, 40);
        camera.position.copy(defaultCameraPos);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const geometry = new THREE.SphereGeometry(1, isLowPowerDevice ? 20 : 48, isLowPowerDevice ? 20 : 48);
        const clickableMarbles = [];
        const marbleMap = {};

        function createMarbleMaterial(colorValue) {
            return new THREE.MeshPhongMaterial({ 
                color: colorValue, 
                shininess: 100,
                transparent: true,
                opacity: 1
            });
        }

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 128;
            context.font = 'Bold 40px "Segoe UI", sans-serif';
            context.fillStyle = '#ffffff';
            context.textAlign = 'center';
            context.fillText(text, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(2, 1, 1);
            sprite.position.set(0, 1.4, 0);
            return sprite;
        }

        membersData.forEach(data => {
            const marble = new THREE.Mesh(geometry, createMarbleMaterial(data.color));
            marble.userData = data;
            marble.add(createTextSprite(data.nick));
            scene.add(marble);
            clickableMarbles.push(marble);
            marbleMap[data.uid] = marble;
        });

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.5, transparent: true });
        function createThread(p1, p2) {
            const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const line = new THREE.Line(geom, lineMaterial.clone());
            scene.add(line);
            return line;
        }

        const connectionsData = [];
        membersData.forEach(m => {
            if (m.spouse) {
                const spouses = Array.isArray(m.spouse) ? m.spouse : [m.spouse];
                spouses.forEach(sUid => {
                    if (marbleMap[sUid]) connectionsData.push([m.uid, sUid]);
                });
            }
            if (m.father && marbleMap[m.father]) {
                connectionsData.push([m.uid, m.father]);
            }
            if (m.mother && marbleMap[m.mother]) {
                connectionsData.push([m.uid, m.mother]);
            }
        });

        const connections = [];
        connectionsData.forEach(pair => {
            if (marbleMap[pair[0]] && marbleMap[pair[1]]) {
                connections.push([marbleMap[pair[0]], marbleMap[pair[1]]]);
            }
        });

        const threads = connections.map(pair => createThread(pair[0].position, pair[1].position));

        let angle = 0;
        function animate(time) {
            requestAnimationFrame(animate);

            if (is2DViewActive()) return;

            TWEEN.update(time);

            if (isAnimating) {
                angle += 0.002;

                const genGroups = {};
                membersData.forEach(m => {
                    if (!genGroups[m.patrilinealGen]) genGroups[m.patrilinealGen] = [];
                    genGroups[m.patrilinealGen].push(m.uid);
                });

                Object.keys(genGroups).forEach(genStr => {
                    const gen = parseInt(genStr);
                    const list = genGroups[genStr];
                    const radius = 8 + (gen * 5);
                    const height = 22 - (gen * 7);

                    list.forEach((uid, idx) => {
                        const itemAngle = angle * (1 + gen * 0.08) + (idx * (Math.PI * 2 / list.length));
                        if (marbleMap[uid]) {
                            marbleMap[uid].position.set(
                                Math.cos(itemAngle) * radius,
                                height,
                                Math.sin(itemAngle) * radius
                            );
                        }
                    });
                });

                clickableMarbles.forEach(m => m.rotation.y += 0.01);
            }

            threads.forEach((thread, index) => {
                const points = [connections[index][0].position, connections[index][1].position];
                thread.geometry.setFromPoints(points);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        const loadingEl = document.getElementById('app-loading');
        if (loadingEl) {
            loadingEl.style.opacity = '0';
            setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
        }

        let currentZoom = 1;
        window.zoomTree = function(delta) {
            currentZoom = Math.max(0.4, Math.min(2.2, currentZoom + delta));
            document.getElementById('tree-2d-view').style.transform = `scale(${currentZoom})`;
            setTimeout(drawSvgConnections, 100);
        };

        window.resetZoom = function() {
            currentZoom = 1;
            document.getElementById('tree-2d-view').style.transform = `scale(1)`;
            setTimeout(drawSvgConnections, 100);
        };

        function setExportButtonsBusy(busy) {
            ['export-png-btn', 'export-svg-btn', 'export-pdf-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = busy;
            });
        }

        async function renderTreeToCanvas() {
            const wrapper = document.getElementById('tree-2d-view');
            if (typeof html2canvas === 'undefined') {
                alert('এক্সপোর্ট লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
                return null;
            }
            const savedZoom = currentZoom;
            wrapper.style.transform = 'scale(1)';
            drawSvgConnections();
            await new Promise(r => setTimeout(r, 60));

            const naturalW = wrapper.scrollWidth;
            const naturalH = wrapper.scrollHeight;
            const MAX_DIMENSION = 8000;
            let scale = 2;
            if (Math.max(naturalW, naturalH) * scale > MAX_DIMENSION) {
                scale = Math.max(1, MAX_DIMENSION / Math.max(naturalW, naturalH));
            }

            const canvas = await html2canvas(wrapper, {
                backgroundColor: '#0f172a',
                scale: scale,
                useCORS: true,
                logging: false
            });

            wrapper.style.transform = `scale(${savedZoom})`;
            drawSvgConnections();

            return canvas;
        }

        window.exportTreeAsPNG = async function() {
            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = 'genogram-tree.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error(err);
                alert('PNG এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        };

        window.exportTreeAsPDF = async function() {
            if (typeof window.jspdf === 'undefined') {
                alert('PDF লাইব্রেরি লোড হয়নি।');
                return;
            }
            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;

                const { jsPDF } = window.jspdf;
                const imgData = canvas.toDataURL('image/png');
                const isLandscape = canvas.width >= canvas.height;
                const pdf = new jsPDF({
                    orientation: isLandscape ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save('genogram-tree.pdf');
            } catch (err) {
                console.error(err);
                alert('PDF এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        };

        window.exportTreeAsSVG = async function() {
            setExportButtonsBusy(true);
            try {
                const wrapper = document.getElementById('tree-2d-view');
                const savedZoom = currentZoom;
                wrapper.style.transform = 'scale(1)';
                drawSvgConnections();
                await new Promise(r => setTimeout(r, 60));

                const width = wrapper.scrollWidth;
                const height = wrapper.scrollHeight;

                let styleText = '';
                document.querySelectorAll('style').forEach(s => { styleText += s.textContent + '\n'; });

                const clone = wrapper.cloneNode(true);
                clone.style.transform = 'none';

                const svgNS = 'http://www.w3.org/2000/svg';
                const svgRoot = document.createElementNS(svgNS, 'svg');
                svgRoot.setAttribute('xmlns', svgNS);
                svgRoot.setAttribute('width', width);
                svgRoot.setAttribute('height', height);
                svgRoot.setAttribute('viewBox', `0 0 ${width} ${height}`);

                const bg = document.createElementNS(svgNS, 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', '#0f172a');
                svgRoot.appendChild(bg);

                const styleEl = document.createElementNS(svgNS, 'style');
                styleEl.textContent = styleText;
                svgRoot.appendChild(styleEl);

                const fo = document.createElementNS(svgNS, 'foreignObject');
                fo.setAttribute('x', '0');
                fo.setAttribute('y', '0');
                fo.setAttribute('width', width);
                fo.setAttribute('height', height);
                const foDiv = document.createElement('div');
                foDiv.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                foDiv.appendChild(clone);
                fo.appendChild(foDiv);
                svgRoot.appendChild(fo);

                wrapper.style.transform = `scale(${savedZoom})`;
                drawSvgConnections();

                const serializer = new XMLSerializer();
                const svgString = '<?xml version="1.0" standalone="no"?>\n' + serializer.serializeToString(svgRoot);
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'genogram-tree.svg';
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            } catch (err) {
                console.error(err);
                alert('SVG এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        };

        function drawSvgConnections() {
            const svg = document.getElementById('tree-svg-canvas');
            const wrapper = document.getElementById('tree-2d-view');
            
            if (!svg || !wrapper) return;
            svg.innerHTML = '';
            
            const wRect = wrapper.getBoundingClientRect();
            
            svg.setAttribute('width', wrapper.scrollWidth || wrapper.offsetWidth);
            svg.setAttribute('height', wrapper.scrollHeight || wrapper.offsetHeight);

            const cards = document.querySelectorAll('.couple-node-card');
            cards.forEach(parentCard => {
                const parentId = parentCard.getAttribute('data-family-id');
                const childrenCards = document.querySelectorAll(`.couple-node-card[data-parent-id="${parentId}"]`);

                if (childrenCards.length > 0) {
                    const pRect = parentCard.getBoundingClientRect();
                    
                    const startX = (pRect.left + pRect.width / 2 - wRect.left) / currentZoom;
                    const startY = (pRect.bottom - wRect.top) / currentZoom;

                    childrenCards.forEach(childCard => {
                        const cRect = childCard.getBoundingClientRect();
                        
                        const endX = (cRect.left + cRect.width / 2 - wRect.left) / currentZoom;
                        const endY = (cRect.top - wRect.top) / currentZoom;

                        const midY = startY + (endY - startY) / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`;
                        path.setAttribute('d', d);
                        path.setAttribute('stroke', '#00ffff');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        path.setAttribute('opacity', '0.9');
                        svg.appendChild(path);
                    });
                }
            });
        }

        document.getElementById('tree-viewport').addEventListener('scroll', drawSvgConnections);

        document.getElementById('tree-2d-overlay').addEventListener('click', (e) => {
            if (e.target.closest('.couple-node-card') || e.target.closest('.zoom-controls')) return;
            setViewMode('3d');
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('pointerdown', (e) => {
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        window.addEventListener('pointerup', (event) => {
            if (event.target.closest('.top-navbar') || event.target.closest('#popup-modal') || event.target.closest('#image-lightbox') || event.target.closest('#tree-2d-overlay')) return;

            const deltaX = Math.abs(event.clientX - touchStartX);
            const deltaY = Math.abs(event.clientY - touchStartY);
            if (deltaX > 8 || deltaY > 8) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableMarbles);

            if (intersects.length > 0) {
                selectMarble(intersects[0].object);
            } else {
                if (isMarbleSelected) {
                    closePopup();
                } else {
                    isAnimating = !isAnimating;
                }
            }
        });

        function animateMarbleTo(mesh, targetPos, duration = 1000) {
            mesh.visible = true;
            new TWEEN.Tween(mesh.position)
                .to(targetPos, duration)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(mesh.material)
                .to({ opacity: 1 }, duration)
                .start();
            
            if (mesh.children[0]) {
                new TWEEN.Tween(mesh.children[0].material)
                    .to({ opacity: 1 }, duration)
                    .start();
            }
        }

        function fadeOutMarble(mesh, duration = 800) {
            new TWEEN.Tween(mesh.material)
                .to({ opacity: 0 }, duration)
                .onComplete(() => { mesh.visible = false; })
                .start();

            if (mesh.children[0]) {
                new TWEEN.Tween(mesh.children[0].material)
                    .to({ opacity: 0 }, duration)
                    .start();
            }
        }

        function selectMarble(selectedMarble) {
            isAnimating = false;
            isMarbleSelected = true;
            
            const data = selectedMarble.userData;
            const activeUids = new Set([data.uid]);

            if (data.spouse) {
                const spouses = Array.isArray(data.spouse) ? data.spouse : [data.spouse];
                spouses.forEach(sUid => activeUids.add(sUid));
            }
            if (data.father) activeUids.add(data.father);
            if (data.mother) activeUids.add(data.mother);
            if (data.children) data.children.forEach(uid => activeUids.add(uid));

            animateMarbleTo(selectedMarble, { x: 0, y: 0, z: 0 });

            if (data.spouse) {
                const spouses = Array.isArray(data.spouse) ? data.spouse : [data.spouse];
                spouses.forEach((sUid, idx) => {
                    if (marbleMap[sUid]) animateMarbleTo(marbleMap[sUid], { x: 3.5 + (idx * 3), y: 0, z: 0 });
                });
            }
            if (data.father && marbleMap[data.father]) animateMarbleTo(marbleMap[data.father], { x: -1.8, y: 3.5, z: 0 });
            if (data.mother && marbleMap[data.mother]) animateMarbleTo(marbleMap[data.mother], { x: 1.8, y: 3.5, z: 0 });

            if (data.children && data.children.length > 0) {
                const count = data.children.length;
                data.children.forEach((childUid, index) => {
                    if (marbleMap[childUid]) {
                        const xPos = (index - (count - 1) / 2) * 3.5;
                        animateMarbleTo(marbleMap[childUid], { x: xPos, y: -3.5, z: 0 });
                    }
                });
            }

            clickableMarbles.forEach(m => {
                if (!activeUids.has(m.userData.uid)) fadeOutMarble(m);
            });

            threads.forEach((thread, index) => {
                const pair = connections[index];
                const isPairActive = activeUids.has(pair[0].userData.uid) && activeUids.has(pair[1].userData.uid);

                if (isPairActive) {
                    thread.visible = true;
                    new TWEEN.Tween(thread.material).to({ opacity: 0.8 }, 1000).start();
                } else {
                    new TWEEN.Tween(thread.material)
                        .to({ opacity: 0 }, 600)
                        .onComplete(() => { thread.visible = false; })
                        .start();
                }
            });

            new TWEEN.Tween(camera.position).to({ x: 0, y: 0, z: 14 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();

            showPopup(data);
        }

        window.focusByUid = function(uid) {
            if (is2DViewActive()) setViewMode('3d');
            if (marbleMap[uid]) selectMarble(marbleMap[uid]);
        };

        function renderRelationLink(uid) {
            if (!uid) return "N/A";
            const uids = Array.isArray(uid) ? uid : [uid];
            const links = uids.map(u => {
                if (!marbleMap[u]) return "N/A";
                const data = marbleMap[u].userData;
                return `<span class="relation-link" onclick="focusByUid('${data.uid}')">${data.bnName}</span>`;
            });
            return links.join(', ');
        }

        function showPopup(data) {
            document.getElementById('m-uid').innerText = data.uid;
            document.getElementById('m-bname').innerText = data.bnName;
            document.getElementById('m-ename').innerText = data.enName;
            document.getElementById('m-gender').innerText = data.gender;
            document.getElementById('m-gen').innerText = "পিতৃকুল Gen " + data.patrilinealGen;
            document.getElementById('m-dual-gen').innerText = `পিতৃকুল: Gen ${data.patrilinealGen} | মাতৃকুল: Gen ${data.matrilinealGen}`;
            
            document.getElementById('m-spouse').innerHTML = renderRelationLink(data.spouse);
            document.getElementById('m-father').innerHTML = renderRelationLink(data.father);
            document.getElementById('m-mother').innerHTML = renderRelationLink(data.mother);

            if (data.children && data.children.length > 0) {
                const childLinks = data.children.map(childUid => renderRelationLink(childUid));
                document.getElementById('m-children').innerHTML = childLinks.join(', ');
            } else {
                document.getElementById('m-children').innerText = "N/A";
            }

            const descContainer = document.getElementById('desc-container');
            if (data.description && data.description.trim() !== "") {
                document.getElementById('m-desc').innerText = data.description;
                descContainer.style.display = 'flex';
            } else {
                descContainer.style.display = 'none';
            }

            loadProfilePhoto(document.getElementById('m-photo'), data.uid);

            document.getElementById('popup-modal').style.display = 'block';
        }

        window.closePopup = function() {
            document.getElementById('popup-modal').style.display = 'none';
            
            clickableMarbles.forEach(m => {
                m.visible = true;
                new TWEEN.Tween(m.material).to({ opacity: 1 }, 800).start();
                if (m.children[0]) {
                    m.children[0].visible = true;
                    new TWEEN.Tween(m.children[0].material).to({ opacity: 1 }, 800).start();
                }
            });

            threads.forEach(t => {
                t.visible = true;
                new TWEEN.Tween(t.material).to({ opacity: 0.5 }, 800).start();
            });

            new TWEEN.Tween(camera.position).to(defaultCameraPos, 1000).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();

            isMarbleSelected = false;
            setTimeout(() => { isAnimating = true; }, 500);
        };

        // Mobile Navbar Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const navToggle = document.getElementById('nav-toggle');
            const navLinks = document.getElementById('nav-links');
            if (navToggle && navLinks) {
                navToggle.addEventListener('click', () => {
                    const open = navLinks.classList.toggle('open');
                    navToggle.setAttribute('aria-expanded', String(open));
                });
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            const lightbox = document.getElementById('image-lightbox');
            const popup = document.getElementById('popup-modal');
            if (lightbox.style.display === 'flex') { closeLightbox(); return; }
            if (popup.style.display === 'block') { closePopup(); return; }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            drawSvgConnections();
        });
    </script>
</body>
</html>
