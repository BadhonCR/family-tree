<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="পারিবারিক বংশবৃক্ষের ৩ডি মডেল ও জিনোগ্রাম (3D Genogram View)">
    <title>পারিবারিক ৩ডি জিনোগ্রাম — Genogram View</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #00ffff;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.4s ease;
        }

        #app-loading .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(0, 255, 255, 0.2);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Top Navbar */
        .top-navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 15, 25, 0.85);
            border-bottom: 1px solid rgba(0, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            color: #00ffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: #00ffff;
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* Popup Modal */
        #popup-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            max-width: 90vw;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(16px);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .popup-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .profile-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffff;
            margin: 0 auto 12px auto;
            display: block;
            background: #1e293b;
        }

        .profile-info {
            font-size: 13px;
            line-height: 1.6;
        }

        .relation-link {
            color: #00ffff;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Lightbox */
        #image-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 6000;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        #image-lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            border: 2px solid #00ffff;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="app-loading">
        <div class="spinner"></div>
        <div>৩ডি জিনোগ্রাম প্রস্তুত হচ্ছে...</div>
    </div>

    <nav class="top-navbar">
        <a href="#" class="nav-logo">
            <span>🌳</span> পারিবারিক ৩ডি জিনোগ্রাম
        </a>
        <div class="nav-menu">
            <a href="#" class="nav-link active" onclick="resetView()">Home</a>
            <a href="#" class="nav-link" onclick="focusBloodline()">Bloodline</a>
            <a href="#" class="nav-link" onclick="showAboutInfo()">About</a>
        </div>
    </nav>

    <div id="popup-modal">
        <div class="popup-header">
            <h3 class="popup-title" id="m-name">সদস্যের নাম</h3>
            <button class="close-btn" id="close-popup-btn">&times;</button>
        </div>
        <img id="m-photo" class="profile-photo" src="" alt="Profile Photo">
        <div class="profile-info">
            <p><strong>ইউআইডি (UID):</strong> <span id="m-uid"></span></p>
            <p><strong>লিঙ্গ:</strong> <span id="m-gender"></span></p>
            <p><strong>পিতা:</strong> <span id="m-father"></span></p>
            <p><strong>মাতা:</strong> <span id="m-mother"></span></p>
            <p><strong>জীবনসঙ্গী:</strong> <span id="m-spouse"></span></p>
        </div>
    </div>

    <div id="image-lightbox">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script type="module">
        import { rawMembersData } from './membersData.js';

        let scene, camera, renderer, controls;
        let marbles = [], marbleMap = new Map();
        let raycaster, mouse;
        const photoCache = new Map();

        // 1. Create Canvas Texture for Marbles (from test.html logic)
        function createMarbleTexture(member) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const hexColor = '#' + (member.color || 0x0055ff).toString(16).padStart(6, '0');

            // Background Gradient
            const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 120);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, hexColor);
            grad.addColorStop(0.8, '#050b14');
            grad.addColorStop(1, '#000000');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Ring Outer Border
            ctx.strokeStyle = hexColor;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(128, 128, 118, 0, Math.PI * 2);
            ctx.stroke();

            // Text (Nickname / Name)
            const textToShow = member.nick || member.bnName.split(' ')[0] || member.uid;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = hexColor;
            ctx.shadowBlur = 12;
            ctx.fillText(textToShow, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        // 2. Init Three.js World
        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0b0b, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 80);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ffff, 1.5, 200);
            pointLight.position.set(20, 50, 50);
            scene.add(pointLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-30, 40, -20);
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildGenogramTree(rawMembersData);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onPointerClick);

            animate();
        }

        // 3. Process Member Data & Position 3D Marbles
        function buildGenogramTree(data) {
            const memberDict = {};
            data.forEach(m => { memberDict[m.uid] = m; });

            // Calculate Generation depth
            function getGenLevel(uid, visited = new Set()) {
                if (visited.has(uid)) return 1;
                visited.add(uid);
                const m = memberDict[uid];
                if (!m) return 1;
                if (m.father && memberDict[m.father]) return getGenLevel(m.father, visited) + 1;
                return 1;
            }

            // Grouping members by generation level
            const genGroups = {};
            data.forEach(m => {
                const gen = getGenLevel(m.uid);
                if (!genGroups[gen]) genGroups[gen] = [];
                genGroups[gen].push(m);
            });

            const sphereGeo = new THREE.SphereGeometry(3.2, 32, 32);

            Object.keys(genGroups).forEach(genStr => {
                const gen = parseInt(genStr);
                const members = genGroups[gen];
                const yPos = (gen - 1) * -18 + 20; // Y spacing between generations
                const total = members.length;

                members.forEach((m, idx) => {
                    const xPos = (idx - (total - 1) / 2) * 12; // X spacing
                    const zPos = (Math.random() - 0.5) * 6;     // Slight Z depth offset

                    const texture = createMarbleTexture(m);
                    const mat = new THREE.MeshPhongMaterial({
                        map: texture,
                        shininess: 90,
                        reflectivity: 0.9,
                        transparent: true,
                        opacity: 0.95
                    });

                    const marbleMesh = new THREE.Mesh(sphereGeo, mat);
                    marbleMesh.position.set(xPos, yPos, zPos);
                    marbleMesh.userData = m;

                    scene.add(marbleMesh);
                    marbles.push(marbleMesh);
                    marbleMap.set(m.uid, marbleMesh);
                });
            });

            // Draw Connection Lines between parents and children
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
            data.forEach(m => {
                const currentMesh = marbleMap.get(m.uid);
                if (!currentMesh) return;

                if (m.father && marbleMap.has(m.father)) {
                    const fatherMesh = marbleMap.get(m.father);
                    const geo = new THREE.BufferGeometry().setFromPoints([
                        fatherMesh.position,
                        currentMesh.position
                    ]);
                    const line = new THREE.Line(geo, lineMat);
                    scene.add(line);
                }
            });
        }

        // 4. Interaction Events
        function onPointerClick(e) {
            // Ignore click on Navbar or Modals
            if (e.target.closest('.top-navbar') || e.target.closest('#popup-modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(marbles);

            if (intersects.length > 0) {
                const selectedMember = intersects[0].object.userData;
                showProfileModal(selectedMember);
                
                // Tween camera focus to selected marble
                new TWEEN.Tween(controls.target)
                    .to(intersects[0].object.position, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }
        }

        function showProfileModal(data) {
            document.getElementById('m-name').innerText = data.bnName || data.enName;
            document.getElementById('m-uid').innerText = data.uid;
            document.getElementById('m-gender').innerText = data.gender === 'Male' ? 'পুরুষ' : 'নারী';
            document.getElementById('m-father').innerText = data.father || 'N/A';
            document.getElementById('m-mother').innerText = data.mother || 'N/A';
            document.getElementById('m-spouse').innerText = Array.isArray(data.spouse) ? data.spouse.join(', ') : (data.spouse || 'N/A');

            // Set placeholder photo
            document.getElementById('m-photo').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.enName || data.uid)}&background=0D8ABC&color=fff`;

            document.getElementById('popup-modal').style.display = 'block';
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();

            // Gentle rotation for marbles
            marbles.forEach(m => {
                m.rotation.y += 0.005;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Global Nav Actions
        window.resetView = function() {
            new TWEEN.Tween(camera.position).to({ x: 0, y: 20, z: 80 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
        };

        window.focusBloodline = function() {
            alert('Bloodline view: ৩ডি স্পেসে প্রধান ধারার সদস্যদের ফোকাস করা হচ্ছে।');
            if (marbles.length > 0) {
                new TWEEN.Tween(controls.target).to(marbles[0].position, 1000).start();
            }
        };

        window.showAboutInfo = function() {
            alert('পারিবারিক ৩ডি জিনোগ্রাম প্রজেক্ট\nডেভেলপড বাই: বাঁধন চন্দ্র রায়');
        };

        // DOM Ready Initializer
        document.addEventListener('DOMContentLoaded', () => {
            init3D();

            document.getElementById('close-popup-btn').onclick = () => {
                document.getElementById('popup-modal').style.display = 'none';
            };

            document.getElementById('m-photo').onclick = function() {
                document.getElementById('lightbox-img').src = this.src;
                document.getElementById('image-lightbox').style.display = 'flex';
            };

            document.getElementById('image-lightbox').onclick = function() {
                this.style.display = 'none';
            };

            // Remove loading screen
            const loadingEl = document.getElementById('app-loading');
            if (loadingEl) {
                loadingEl.style.opacity = '0';
                setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
            }
        });
    </script>
</body>
</html>
