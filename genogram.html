                { id: "FT-115", name: "Ruddra Roy", nick: "", nameBn: "রৌদ্র রায়", gender: "M", spouse: "", father: "FT-113", mother: "FT-110", alive: "Yes" },
                { id: "FT-117", name: "Suranjana Rani Roy", nick: "", nameBn: "শুরঞ্জনা রানী রায়", gender: "F", spouse: "", father: "", mother: "FT-111", alive: "Yes" },
                { id: "FT-118", name: "Son of Sapna", nick: "", nameBn: "স্বপ্নার ছেলে", gender: "M", spouse: "", father: "", mother: "FT-111", alive: "Yes" },
                { id: "FT-120", name: "Son of Maitri", nick: "", nameBn: "মৈত্রীর ছেলে", gender: "M", spouse: "", father: "", mother: "FT-112", alive: "Yes" },
                { id: "FT-122", name: "Heman", nick: "", nameBn: "হেমেন চন্দ্র রায়", gender: "M", spouse: "", father: "FT-098", mother: "", alive: "Yes" },
                { id: "FT-123", name: "Uttom", nick: "", nameBn: "উত্তম চন্দ্র রায়", gender: "M", spouse: "", father: "FT-122", mother: "", alive: "Yes" },
                { id: "FT-124", name: "Soityan", nick: "", nameBn: "সৈত্যান চন্দ্র রায়", gender: "M", spouse: "", father: "FT-122", mother: "", alive: "Yes" },
                { id: "FT-125", name: "Suchittra Rani Roy", nick: "", nameBn: "সুচিত্রা রানী রায়", gender: "F", spouse: "", father: "FT-122", mother: "", alive: "Yes" },
                { id: "FT-126", name: "Suphala Rani Roy", nick: "", nameBn: "সুফলা রানী রায়", gender: "F", spouse: "", father: "FT-122", mother: "", alive: "Yes" },
                { id: "FT-128", name: "Tumpa Rani Roy", nick: "", nameBn: "টুম্পা রানী রায়", gender: "F", spouse: "", father: "FT-123", mother: "", alive: "Yes" },
                { id: "FT-129", name: "Mou Rani Roy", nick: "", nameBn: "মৌ", gender: "F", spouse: "", father: "", mother: "FT-125", alive: "Yes" }
            ];

            // --------------------------------------------------------------
            // ২. ডেটা প্রসেসিং – নোড ও এজ তৈরি (শুধু বৈধ আইডি সহ)
            // --------------------------------------------------------------
            const allIds = new Set(rawPeople.map(p => p.id));

            // নোড তৈরি
            const nodes = rawPeople.map(p => ({
                id: p.id,
                name: p.name || p.nick || p.id,
                gender: p.gender || 'U',
                alive: p.alive,
                fullName: p.name,
                nick: p.nick,
                nameBn: p.nameBn,
                spouse: p.spouse,
                father: p.father,
                mother: p.mother,
                group: p.gender === 'M' ? 'male' : (p.gender === 'F' ? 'female' : 'unknown')
            }));

            // এজ তৈরি (শুধুমাত্র যদি উভয় আইডি বিদ্যমান থাকে)
            const edges = [];
            const edgeSet = new Set(); // ডুপ্লিকেট এজ বাদ দিতে

            rawPeople.forEach(p => {
                // পিতৃ-সন্তান
                if (p.father && allIds.has(p.father)) {
                    const key = `${p.father}-${p.id}-parent`;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({ source: p.father, target: p.id, type: 'parent' });
                    }
                }
                if (p.mother && allIds.has(p.mother)) {
                    const key = `${p.mother}-${p.id}-parent`;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({ source: p.mother, target: p.id, type: 'parent' });
                    }
                }
                // দাম্পত্য (spouse) – একবার যোগ করলেই যথেষ্ট
                if (p.spouse && allIds.has(p.spouse) && p.id < p.spouse) {
                    const key = `${p.id}-${p.spouse}-spouse`;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({ source: p.id, target: p.spouse, type: 'spouse' });
                    }
                }
            });

            console.log(`📊 মোট নোড: ${nodes.length}, মোট এজ: ${edges.length}`);

            // যদি কোনো নোড না থাকে, তাহলে মেসেজ দেখান
            if (nodes.length === 0) {
                document.getElementById('loading').textContent = '❌ কোনো ডেটা পাওয়া যায়নি!';
                return;
            }

            // --------------------------------------------------------------
            // ৩. 3D ফোর্স গ্রাফ রেন্ডার
            // --------------------------------------------------------------
            // দ্রষ্টব্য: 3d-force-graph লাইব্রেরির আসল (UMD) API একটি টু-স্টেপ ফ্যাক্টরি প্যাটার্ন —
            // প্রথমে ForceGraph3D() কল করলে একটা "ইনস্ট্যান্স" ফাংশন পাওয়া যায়, তারপর সেটাকে
            // DOM এলিমেন্ট দিয়ে কল করলে (mount) সেটা আসল গ্রাফ চেইনেবল অবজেক্ট রিটার্ন করে।
            const Graph = ForceGraph3D()(document.body)
                .width(window.innerWidth)
                .height(window.innerHeight)
                .backgroundColor(0x0a0a1a)
                .nodeColor(node => {
                    if (node.gender === 'M') return '#4a90d9';
                    if (node.gender === 'F') return '#e74c8b';
                    return '#888';
                })
                .nodeVal(1.2)
                .nodeLabel(node => {
                    return `
                        <div style="font-size:14px; font-weight:bold;">${node.name}</div>
                        <div style="font-size:12px; color:#aaa;">${node.nameBn || ''}</div>
                        <div style="font-size:11px; margin-top:4px; color:#ccc;">
                            ${node.gender === 'M' ? '♂ পুরুষ' : (node.gender === 'F' ? '♀ নারী' : '')}
                            ${node.alive === 'Yes' ? ' · জীবিত' : (node.alive === 'No' ? ' · মৃত' : '')}
                        </div>
                        <div style="font-size:10px; color:#888; margin-top:2px;">ID: ${node.id}</div>
                    `;
                })
                .linkColor(link => link.type === 'spouse' ? '#ffaa66' : '#66aaff')
                .linkWidth(link => link.type === 'spouse' ? 2 : 1.5)
                .linkDirectionalParticles(link => link.type === 'spouse' ? 2 : 0)
                .linkDirectionalParticleWidth(1)
                .linkOpacity(0.6)
                .linkLabel(link => link.type === 'spouse' ? 'দাম্পত্য' : 'পিতৃ-সন্তান')
                .nodeThreeObject(node => {
                    // কাস্টম স্ফিয়ার
                    const color = node.gender === 'M' ? 0x4a90d9 : (node.gender === 'F' ? 0xe74c8b : 0x888888);
                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(0.6, 16, 16),
                        new THREE.MeshStandardMaterial({
                            color: color,
                            roughness: 0.4,
                            metalness: 0.1,
                            emissive: new THREE.Color(color).multiplyScalar(0.15)
                        })
                    );
                    return sphere;
                })
                .linkThreeObject(link => {
                    // স্পাউস লাইন ড্যাশড
                    if (link.type === 'spouse') {
                        const geom = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(0,0,0),
                            new THREE.Vector3(1,0,0)
                        ]);
                        const mat = new THREE.LineDashedMaterial({
                            color: 0xffaa66,
                            dashSize: 0.1,
                            gapSize: 0.05,
                            linewidth: 2
                        });
                        const line = new THREE.Line(geom, mat);
                        line.computeLineDistances();
                        return line;
                    }
                    return null;
                })
                .onLinkHover(link => {
                    const tooltip = document.getElementById('tooltip');
                    if (link) {
                        tooltip.style.display = 'block';
                        tooltip.innerHTML = `<strong>${link.type === 'spouse' ? 'দাম্পত্য' : 'পিতৃ-সন্তান'}</strong>`;
                        tooltip.style.left = (window.event?.clientX || 0) + 14 + 'px';
                        tooltip.style.top = (window.event?.clientY || 0) - 10 + 'px';
                    } else {
                        tooltip.style.display = 'none';
                    }
                })
                .nodeRelSize(4)
                .linkDistance(link => link.type === 'spouse' ? 30 : 45)
                .numDimensions(3)
                .damping(0.9)
                .warmupTicks(100)
                .cooldownTicks(100)
                .onNodeClick(node => {
                    // ফেসবুক লিংক খুঁজি
                    const fb = rawPeople.find(p => p.id === node.id)?.fbId;
                    if (fb && fb.startsWith('http')) {
                        window.open(fb, '_blank');
                    }
                });

            // গ্রাফে ডেটা সেট
            Graph.graphData({ nodes, links: edges });

            // লোডিং মেসেজ মুছে ফেলি
            document.getElementById('loading').style.display = 'none';

            // অটোরোটেট চালু
            Graph.autoRotate(true);
            Graph.autoRotateSpeed(0.8);

            // ডাবল ক্লিক টগল
            let autoRotate = true;
            document.addEventListener('dblclick', () => {
                autoRotate = !autoRotate;
                Graph.autoRotate(autoRotate);
            });

            // উইন্ডো রিসাইজ
            window.addEventListener('resize', () => {
                Graph.width(window.innerWidth).height(window.innerHeight);
            });

            // মাউস মুভে টুলটিপ আপডেট
            document.addEventListener('mousemove', (e) => {
                const tooltip = document.getElementById('tooltip');
                if (tooltip.style.display === 'block') {
                    tooltip.style.left = e.clientX + 14 + 'px';
                    tooltip.style.top = e.clientY - 10 + 'px';
                }
            });

            console.log('✅ ৩D জেনোগ্রাম সফলভাবে লোড হয়েছে!');
        } catch (err) {
              console.error(err);
              const loadingEl = document.getElementById('loading');
              if (loadingEl) {
                  loadingEl.style.display = 'block';
                  loadingEl.style.color = '#ff6b6b';
                  loadingEl.style.maxWidth = '80vw';
                  loadingEl.style.textAlign = 'center';
                  loadingEl.innerHTML = '❌ লোড করতে সমস্যা হয়েছে:<br><span style="font-size:12px;">' + (err.message || err) + '</span>';
              }
          }
        })();
    </script>
</body>
</html>
