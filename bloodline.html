<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="পারিবারিক বংশবৃক্ষ — ২ডি ব্লাডলাইন ট্র্যাকার ও এক্সপোর্ট টুল।">
    <title>পারিবারিক বংশবৃক্ষ — ২ডি ব্লাডলাইন ট্র্যাকার</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #00ffff;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.4s ease;
        }

        #app-loading .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(0, 255, 255, 0.2);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Top Navbar — same visual language as Home */
        .top-navbar {
            position: sticky; top:0; z-index:1000; padding:10px 18px;
            background:rgba(6,10,18,.82);
            border-bottom:1px solid rgba(0,255,255,.14);
            backdrop-filter:blur(20px) saturate(140%);
            -webkit-backdrop-filter:blur(20px) saturate(140%);
            box-shadow:0 8px 30px rgba(0,0,0,.28);
        }
        .nav-inner {
            width:min(1180px,100%); min-height:58px; margin:auto;
            display:flex; align-items:center; justify-content:space-between; gap:24px;
        }
        .nav-logo {color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;min-width:max-content;}
        .logo-mark {
            width:40px;height:40px;display:grid;place-items:center;border-radius:12px;font-size:21px;
            background:linear-gradient(145deg,rgba(0,255,255,.18),rgba(56,189,248,.08));
            border:1px solid rgba(0,255,255,.25);box-shadow:inset 0 0 18px rgba(0,255,255,.08);
        }
        .logo-text {display:flex;flex-direction:column;line-height:1.1;}
        .logo-text strong {font-size:15px;letter-spacing:.2px;}
        .logo-text small {color:#64748b;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
        .nav-links {
            display:flex;align-items:center;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.07);
            border-radius:15px;background:rgba(255,255,255,.025);
        }
        .nav-btn {
            color:#94a3b8;background:transparent;border:0;padding:10px 14px;border-radius:10px;
            font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;
            align-items:center;justify-content:center;gap:7px;transition:.22s ease;white-space:nowrap;
        }
        .nav-btn span {font-size:14px;opacity:.85;}
        .nav-btn:hover {color:#fff;background:rgba(0,255,255,.07);}
        .nav-btn.active {
            color:#fff;background:linear-gradient(135deg,rgba(0,180,219,.92),rgba(0,131,176,.92));
            box-shadow:0 5px 18px rgba(0,200,255,.18);
        }
        .nav-btn.active span {color:#dffcff;}
        .nav-toggle {
            display:none;width:42px;height:42px;border:1px solid rgba(0,255,255,.2);
            border-radius:11px;background:rgba(0,255,255,.06);cursor:pointer;padding:9px;
        }
        .nav-toggle span {display:block;height:2px;margin:5px 0;border-radius:4px;background:#00ffff;transition:.2s;}

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Control Card */
        .control-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 14px;
            padding: 18px 22px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 260px;
        }

        .select-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }

        .custom-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }


        .native-select-hidden { display:none !important; }
        .member-picker { min-width:min(100%, 420px); position:relative; }
        .member-search-wrap { position:relative; }
        .member-search-input { padding:11px 42px 11px 40px; cursor:text; }
        .member-search-input:focus { border-color:#00ffff; box-shadow:0 0 0 3px rgba(0,255,255,.08); }
        .search-icon {
            position:absolute; left:14px; top:50%; transform:translateY(-51%);
            color:#00ffff; font-size:19px; z-index:2; pointer-events:none;
        }
        .member-clear {
            position:absolute; right:9px; top:50%; transform:translateY(-50%);
            width:27px;height:27px;border:0;border-radius:8px;background:transparent;
            color:#64748b;font-size:20px;cursor:pointer;display:none;z-index:3;
        }
        .member-clear:hover {color:#fff;background:rgba(255,255,255,.07);}
        .member-options {
            position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:1200;
            display:none;max-height:310px;overflow-y:auto;padding:6px;
            background:rgba(8,14,24,.98);border:1px solid rgba(0,255,255,.28);
            border-radius:13px;box-shadow:0 18px 45px rgba(0,0,0,.65);
            backdrop-filter:blur(16px);
        }
        .member-options.open {display:block;}
        .member-option {
            display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
            cursor:pointer;border:1px solid transparent;transition:.16s ease;
        }
        .member-option:hover,.member-option.highlighted {
            background:rgba(0,255,255,.09);border-color:rgba(0,255,255,.16);
        }
        .member-option-avatar {
            width:35px;height:35px;border-radius:50%;object-fit:cover;flex-shrink:0;
            border:1px solid rgba(0,255,255,.55);background:#1a2230;
        }
        .member-option-text {min-width:0;line-height:1.25;}
        .member-option-text strong {display:block;color:#f8fafc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .member-option-text small {display:block;color:#64748b;font-size:10px;margin-top:3px;}
        .member-option-badge {
            margin-left:auto;color:#00ffff;font-size:9px;border:1px solid rgba(0,255,255,.18);
            background:rgba(0,255,255,.06);padding:3px 6px;border-radius:6px;white-space:nowrap;
        }
        .picker-empty {padding:18px 10px;text-align:center;color:#64748b;font-size:12px;}
        .picker-hint {margin-top:5px;color:#64748b;font-size:10px;}

        /* Export Buttons Toolbar */
        .export-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .action-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 16px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
        }

        .btn-png { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; }
        .btn-svg { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: white; border: none; }
        .btn-pdf { background: linear-gradient(135deg, #dc2626, #7f1d1d); color: white; border: none; }


        .control-card {
            background:linear-gradient(135deg,rgba(15,23,42,.84),rgba(8,14,24,.82));
            border-color:rgba(0,255,255,.18);
            box-shadow:0 12px 35px rgba(0,0,0,.22);
        }
        .control-card::before {
            content:""; width:3px; align-self:stretch; border-radius:5px;
            background:linear-gradient(#00ffff,transparent); opacity:.8;
        }
        #tree-2d-viewport {
            min-height:600px;
            box-shadow:inset 0 0 55px rgba(0,0,0,.25),0 14px 35px rgba(0,0,0,.25);
        }

        /* 2D Tree Canvas View */
        #tree-2d-viewport {
            width: 100%;
            min-height: 600px;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: auto;
            padding: 40px;
            box-sizing: border-box;
        }

        .tree-2d-wrapper {
            position: relative;
            transform-origin: center top;
            transition: transform 0.15s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            min-width: max-content;
            margin: 0 auto;
            padding: 20px;
        }

        .gen-2d-block { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; }
        .nodes-2d-row { display: flex; gap: 32px; justify-content: center; position: relative; }

        .couple-node-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.2);
            position: relative;
            z-index: 2;
        }

        .couple-node-card.root-card {
            border-color: #ffda79;
            box-shadow: 0 0 20px rgba(255, 218, 121, 0.4);
        }

        .person-unit { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .person-unit:hover .card-2d-name { color: #00ffff; }
        .spouse-unit { color: #ff79c6; }
        .spouse-divider { color: #ff79c6; font-size: 13px; font-weight: bold; }
        .card-2d-name { font-weight: 700; font-size: 13px; color: #f8fafc; white-space: nowrap; }

        .node-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #00ffff;
            background: #1a2230;
            flex-shrink: 0;
        }

        #tree-svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Profile Popup Modal */
        #popup-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, rgba(15, 23, 36, 0.96), rgba(8, 14, 24, 0.98));
            color: #e2e8f0;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85), 0 0 15px rgba(0, 255, 255, 0.15);
            z-index: 3500;
            width: 340px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 255, 0.35);
            backdrop-filter: blur(16px);
        }

        .popup-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .popup-header-container h2 { margin: 0 0 6px 0; color: #00ffff; font-size: 19px; font-weight: 700; }
        .uid-gen-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .uid-badge { font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.12); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 600; }
        .gen-badge { font-size: 11px; color: #00ffff; background: rgba(0, 255, 255, 0.15); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(0, 255, 255, 0.4); font-weight: 600; }
        .profile-details-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }

        .profile-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-field.block-field { flex-direction: column; align-items: flex-start; gap: 4px; }
        .field-label { color: #94a3b8; font-size: 12px; font-weight: 600; }
        .field-value { color: #f8fafc; font-weight: 500; text-align: right; }
        .profile-img-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; border: 2px solid #00ffff; cursor: pointer; background-color: #1a2230; flex-shrink: 0; }
        .btn-close { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

        #image-lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 4000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }

        #image-lightbox img { max-width: 85%; max-height: 85%; border-radius: 12px; border: 2px solid #00ffff; }

        @media (max-width: 768px) {
            .top-navbar {padding:9px 12px;}
            .nav-inner {min-height:54px;}
            .nav-toggle {display:block;}
            .nav-links {
                position:absolute;top:calc(100% + 8px);left:12px;right:12px;
                display:none;flex-direction:column;align-items:stretch;gap:4px;padding:7px;
                border-radius:14px;background:rgba(8,14,24,.97);
                border-color:rgba(0,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.55);
            }
            .nav-links.open {display:flex;}
            .nav-btn {justify-content:flex-start;padding:12px 14px;}
            .logo-text strong {font-size:13px;}
            .logo-text small {font-size:8px;}
            .control-card {flex-direction:column;align-items:stretch;padding:16px;}
            .control-card::before {display:none;}
            .select-group {min-width:0;width:100%;}
            .export-controls {justify-content:stretch;display:grid;grid-template-columns:repeat(3,1fr);}
            .action-btn {justify-content:center;padding:8px 10px;}
            #tree-2d-viewport {min-height:480px;padding:20px;}
            .member-options {max-height:260px;}
        }
        @media (max-width:390px) {
            .logo-mark {width:36px;height:36px;}
            .logo-text strong {font-size:12px;}
            .export-controls {grid-template-columns:repeat(2,1fr);}
        }
            html { scroll-behavior:smooth; }
    </style>
</head>
<body>

    <div id="app-loading" aria-live="polite">
        <div class="spinner"></div>
        <div>২ডি ব্লাডলাইন প্রসেস হচ্ছে...</div>
    </div>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="nav-inner">
            <a href="home.html" class="nav-logo" aria-label="পারিবারিক বংশবৃক্ষ হোম">
                <span class="logo-mark">🌳</span>
                <span class="logo-text">
                    <strong>পারিবারিক বংশবৃক্ষ</strong>
                    <small>Family Archive</small>
                </span>
            </a>

            <button class="nav-toggle" id="nav-toggle" aria-label="মেনু খুলুন" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>

            <nav class="nav-links" id="nav-links" aria-label="প্রধান নেভিগেশন">
                <a href="home.html" class="nav-btn"><span>⌂</span> Home</a>
                <a href="genogram.html" class="nav-btn"><span>◎</span> Genogram</a>
                <a href="bloodline.html" class="nav-btn active"><span>◈</span> Bloodline</a>
                <a href="home.html#about" class="nav-btn"><span>ⓘ</span> About</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">

        <!-- CONTROL & EXPORT CARD -->
        <section class="control-card">
            <div class="select-group member-picker">
                <label for="member-search">মূল সদস্য নির্বাচন করুন:</label>
                <div class="member-search-wrap">
                    <span class="search-icon">⌕</span>
                    <input id="member-search" class="custom-select member-search-input"
                           type="text" placeholder="সদস্যের নাম লিখে খুঁজুন..." autocomplete="off"
                           aria-autocomplete="list" aria-controls="member-options" aria-expanded="false">
                    <button type="button" id="member-clear" class="member-clear" aria-label="নির্বাচন মুছুন">×</button>
                    <div id="member-options" class="member-options" role="listbox"></div>
                </div>
                <select id="member-select" class="native-select-hidden" aria-hidden="true" tabindex="-1">
                    <option value="">-- সদস্য নির্বাচন করুন --</option>
                </select>
                <div class="picker-hint">নাম, ডাকনাম বা UID লিখে সদস্য খুঁজে নির্বাচন করুন</div>
            </div>

            <!-- ZOOM & EXPORT TOOLBAR -->
            <div class="export-controls">
                <button class="action-btn" id="zoom-in-btn" title="Zoom In">➕</button>
                <button class="action-btn" id="zoom-out-btn" title="Zoom Out">➖</button>
                <button class="action-btn" id="zoom-reset-btn" title="Reset Zoom">↺</button>
                <button class="action-btn btn-png" id="export-png-btn">🖼️ PNG</button>
                <button class="action-btn btn-svg" id="export-svg-btn">🧬 SVG</button>
                <button class="action-btn btn-pdf" id="export-pdf-btn">📄 PDF</button>
            </div>
        </section>

        <!-- 2D TREE VIEWPORT -->
        <section id="tree-2d-viewport">
            <div id="tree-2d-view" class="tree-2d-wrapper">
                <svg id="tree-svg-canvas"></svg>
            </div>
        </section>

    </main>

    <!-- PROFILE POPUP MODAL -->
    <div id="popup-modal">
        <div class="popup-header-container">
            <div>
                <h2 id="m-bname">প্রোফাইল বিবরণ</h2>
                <div class="uid-gen-wrapper">
                    <span class="uid-badge">UID: <span id="m-uid"></span></span>
                    <span class="gen-badge" id="m-gen"></span>
                </div>
            </div>
            <img id="m-photo" class="profile-img-thumb" src="" alt="Profile Photo">
        </div>

        <div class="profile-details-list">
            <div class="profile-field">
                <span class="field-label">ইংরেজি নাম:</span>
                <span class="field-value" id="m-ename"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">লিঙ্গ:</span>
                <span class="field-value" id="m-gender"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">দ্বৈত জেনারেশন ইনডেক্স:</span>
                <span class="field-value" id="m-dual-gen" style="color: #00ffff; font-weight: bold;"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">দাম্পত্য সঙ্গী:</span>
                <span class="field-value" id="m-spouse"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">পিতার নাম:</span>
                <span class="field-value" id="m-father"></span>
            </div>
            <div class="profile-field">
                <span class="field-label">মাতার নাম:</span>
                <span class="field-value" id="m-mother"></span>
            </div>
            <div class="profile-field block-field">
                <span class="field-label">সন্তানগণ:</span>
                <span class="field-value" id="m-children"></span>
            </div>
            <div class="profile-field block-field" id="desc-container">
                <span class="field-label">বিবরণ:</span>
                <span class="field-value" id="m-desc" style="color: #ffda79;"></span>
            </div>
        </div>

        <button id="close-popup-btn" class="btn-close" style="margin-top:16px; width:100%; padding:9px;">বন্ধ করুন</button>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="image-lightbox">
        <img id="lightbox-img" src="" alt="Full View">
    </div>

    <!-- EXTERNAL LIBRARIES FOR EXPORT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- JS MODULE IMPORT & LOGIC -->
    <script type="module">
        import { membersData } from './js/membersData.js';

        let currentZoom = 1;

        const DEFAULT_NO_IMAGE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2000ffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/><line x1='3' y1='3' x2='21' y2='21'/></svg>";

        function loadProfilePhoto(imgEl, uid) {
            const candidates = [
                `images/${uid}.jpg`,
                `images/${uid}.jpeg`,
                `images/${uid}.png`,
                `images/${uid} 01.jpg`
            ];
            let i = 0;
            function tryNext() {
                if (i >= candidates.length) {
                    imgEl.onerror = null;
                    imgEl.src = DEFAULT_NO_IMAGE;
                    return;
                }
                imgEl.src = candidates[i++];
            }
            imgEl.onerror = tryNext;
            tryNext();
        }

        function openLightbox(src) {
            if (!src || src.includes("data:image/svg+xml")) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('image-lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('image-lightbox').style.display = 'none';
        }

        /* ----- 2D TREE GENERATION ----- */
        function render2DTreeView() {
            const rootUid = document.getElementById('member-select').value;
            const container2D = document.getElementById('tree-2d-view');

            if (!rootUid) {
                container2D.innerHTML = '<p style="color:#aaa; text-align:center; padding-top:40px;">বংশবৃক্ষ দেখতে উপরে একটি সদস্য নির্বাচন করুন।</p>';
                return;
            }

            container2D.innerHTML = '<svg id="tree-svg-canvas"></svg>';

            const relativeGenMap = {};
            const visited = new Set([rootUid]);
            const queue = [{ uid: rootUid, relGen: 0, parentUid: null }];

            while (queue.length > 0) {
                const current = queue.shift();
                if (!relativeGenMap[current.relGen]) relativeGenMap[current.relGen] = [];

                const personObj = membersData.find(m => m.uid === current.uid);
                if (personObj) {
                    relativeGenMap[current.relGen].push({ person: personObj, parentUid: current.parentUid });

                    if (personObj.children) {
                        personObj.children.forEach(childUid => {
                            if (!visited.has(childUid)) {
                                visited.add(childUid);
                                queue.push({ uid: childUid, relGen: current.relGen + 1, parentUid: current.uid });
                            }
                        });
                    }
                }
            }

            const sortedGens = Object.keys(relativeGenMap).sort((a,b) => a - b);
            sortedGens.forEach(genLevel => {
                const block = document.createElement('div');
                block.className = 'gen-2d-block';

                const row = document.createElement('div');
                row.className = 'nodes-2d-row';

                relativeGenMap[genLevel].forEach(entry => {
                    const p = entry.person;
                    const coupleCard = document.createElement('div');
                    coupleCard.className = `couple-node-card ${p.uid === rootUid ? 'root-card' : ''}`;
                    coupleCard.setAttribute('data-family-id', p.uid);
                    if (entry.parentUid) coupleCard.setAttribute('data-parent-id', entry.parentUid);

                    const imgId = `node-img-${p.uid}`;
                    let cardHtml = `
                        <div class="person-unit" id="unit-${p.uid}">
                            <img id="${imgId}" class="node-avatar" loading="lazy" src="" alt="Photo">
                            <span class="card-2d-name">${p.nick}</span>
                        </div>
                    `;

                    if (p.spouse) {
                        const spouses = Array.isArray(p.spouse) ? p.spouse : [p.spouse];
                        spouses.forEach(sUid => {
                            const spouseObj = membersData.find(m => m.uid === sUid);
                            if (spouseObj) {
                                const spouseImgId = `node-img-${spouseObj.uid}`;
                                cardHtml += `
                                    <div class="spouse-divider">💍</div>
                                    <div class="person-unit spouse-unit" id="unit-${spouseObj.uid}">
                                        <img id="${spouseImgId}" class="node-avatar" loading="lazy" src="" alt="Photo">
                                        <span class="card-2d-name">${spouseObj.nick}</span>
                                    </div>
                                `;
                                setTimeout(() => {
                                    const simg = document.getElementById(spouseImgId);
                                    if (simg) loadProfilePhoto(simg, spouseObj.uid);
                                }, 10);
                            }
                        });
                    }

                    coupleCard.innerHTML = cardHtml;
                    row.appendChild(coupleCard);

                    setTimeout(() => {
                        const pimg = document.getElementById(imgId);
                        if (pimg) loadProfilePhoto(pimg, p.uid);
                        
                        document.getElementById(`unit-${p.uid}`).onclick = () => showProfileByUid(p.uid);
                        if (p.spouse) {
                            const spouses = Array.isArray(p.spouse) ? p.spouse : [p.spouse];
                            spouses.forEach(sUid => {
                                const el = document.getElementById(`unit-${sUid}`);
                                if (el) el.onclick = () => showProfileByUid(sUid);
                            });
                        }
                    }, 10);
                });

                block.appendChild(row);
                container2D.appendChild(block);
            });

            setTimeout(drawSvgConnections, 150);
        }

        function drawSvgConnections() {
            const svg = document.getElementById('tree-svg-canvas');
            const wrapper = document.getElementById('tree-2d-view');
            
            if (!svg || !wrapper) return;
            svg.innerHTML = '';
            
            const wRect = wrapper.getBoundingClientRect();
            svg.setAttribute('width', wrapper.scrollWidth || wrapper.offsetWidth);
            svg.setAttribute('height', wrapper.scrollHeight || wrapper.offsetHeight);

            const cards = document.querySelectorAll('.couple-node-card');
            cards.forEach(parentCard => {
                const parentId = parentCard.getAttribute('data-family-id');
                const childrenCards = document.querySelectorAll(`.couple-node-card[data-parent-id="${parentId}"]`);

                if (childrenCards.length > 0) {
                    const pRect = parentCard.getBoundingClientRect();
                    const startX = (pRect.left + pRect.width / 2 - wRect.left) / currentZoom;
                    const startY = (pRect.bottom - wRect.top) / currentZoom;

                    childrenCards.forEach(childCard => {
                        const cRect = childCard.getBoundingClientRect();
                        const endX = (cRect.left + cRect.width / 2 - wRect.left) / currentZoom;
                        const endY = (cRect.top - wRect.top) / currentZoom;
                        const midY = startY + (endY - startY) / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`;
                        path.setAttribute('d', d);
                        path.setAttribute('stroke', '#00ffff');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        path.setAttribute('opacity', '0.9');
                        svg.appendChild(path);
                    });
                }
            });
        }

        /* ----- ZOOM LOGIC ----- */
        function zoomTree(delta) {
            currentZoom = Math.max(0.4, Math.min(2.2, currentZoom + delta));
            document.getElementById('tree-2d-view').style.transform = `scale(${currentZoom})`;
            setTimeout(drawSvgConnections, 100);
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('tree-2d-view').style.transform = `scale(1)`;
            setTimeout(drawSvgConnections, 100);
        }

        /* ----- EXPORT FUNCTIONS (PNG, SVG, PDF) ----- */
        function setExportButtonsBusy(busy) {
            ['export-png-btn', 'export-svg-btn', 'export-pdf-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = busy;
            });
        }

        function getExportFilename(ext) {
            const selectEl = document.getElementById('member-select');
            const uid = selectEl.value;
            const m = membersData.find(x => x.uid === uid);
            const label = m ? m.bnName.replace(/[^\w\u0980-\u09FF]+/g, '_') : 'bloodline-tree';
            return `${label}.${ext}`;
        }

        async function renderTreeToCanvas() {
            const wrapper = document.getElementById('tree-2d-view');
            if (typeof html2canvas === 'undefined') {
                alert('এক্সপোর্ট লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
                return null;
            }

            const savedZoom = currentZoom;
            wrapper.style.transform = 'scale(1)';
            drawSvgConnections();
            await new Promise(r => setTimeout(r, 60));

            const canvas = await html2canvas(wrapper, {
                backgroundColor: '#0f172a',
                scale: 2,
                useCORS: true,
                logging: false
            });

            wrapper.style.transform = `scale(${savedZoom})`;
            drawSvgConnections();
            return canvas;
        }

        async function exportTreeAsPNG() {
            const uid = document.getElementById('member-select').value;
            if (!uid) { alert('প্রথমে একজন সদস্য নির্বাচন করুন।'); return; }

            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = getExportFilename('png');
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error(err);
                alert('PNG এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        async function exportTreeAsPDF() {
            const uid = document.getElementById('member-select').value;
            if (!uid) { alert('প্রথমে একজন সদস্য নির্বাচন করুন।'); return; }

            if (typeof window.jspdf === 'undefined') {
                alert('PDF লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
                return;
            }

            setExportButtonsBusy(true);
            try {
                const canvas = await renderTreeToCanvas();
                if (!canvas) return;

                const { jsPDF } = window.jspdf;
                const imgData = canvas.toDataURL('image/png');
                const isLandscape = canvas.width >= canvas.height;
                const pdf = new jsPDF({
                    orientation: isLandscape ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save(getExportFilename('pdf'));
            } catch (err) {
                console.error(err);
                alert('PDF এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        async function exportTreeAsSVG() {
            const uid = document.getElementById('member-select').value;
            if (!uid) { alert('প্রথমে একজন সদস্য নির্বাচন করুন।'); return; }

            setExportButtonsBusy(true);
            try {
                const wrapper = document.getElementById('tree-2d-view');
                const savedZoom = currentZoom;
                wrapper.style.transform = 'scale(1)';
                drawSvgConnections();
                await new Promise(r => setTimeout(r, 60));

                const width = wrapper.scrollWidth;
                const height = wrapper.scrollHeight;

                let styleText = '';
                document.querySelectorAll('style').forEach(s => { styleText += s.textContent + '\n'; });

                const clone = wrapper.cloneNode(true);
                clone.style.transform = 'none';

                const svgNS = 'http://www.w3.org/2000/svg';
                const svgRoot = document.createElementNS(svgNS, 'svg');
                svgRoot.setAttribute('xmlns', svgNS);
                svgRoot.setAttribute('width', width);
                svgRoot.setAttribute('height', height);
                svgRoot.setAttribute('viewBox', `0 0 ${width} ${height}`);

                const bg = document.createElementNS(svgNS, 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', '#0f172a');
                svgRoot.appendChild(bg);

                const styleEl = document.createElementNS(svgNS, 'style');
                styleEl.textContent = styleText;
                svgRoot.appendChild(styleEl);

                const fo = document.createElementNS(svgNS, 'foreignObject');
                fo.setAttribute('x', '0');
                fo.setAttribute('y', '0');
                fo.setAttribute('width', width);
                fo.setAttribute('height', height);
                const foDiv = document.createElement('div');
                foDiv.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                foDiv.appendChild(clone);
                fo.appendChild(foDiv);
                svgRoot.appendChild(fo);

                wrapper.style.transform = `scale(${savedZoom})`;
                drawSvgConnections();

                const serializer = new XMLSerializer();
                const svgString = '<?xml version="1.0" standalone="no"?>\n' + serializer.serializeToString(svgRoot);
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = getExportFilename('svg');
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            } catch (err) {
                console.error(err);
                alert('SVG এক্সপোর্ট ব্যর্থ হয়েছে।');
            } finally {
                setExportButtonsBusy(false);
            }
        }

        /* ----- PROFILE POPUP UI LOGIC ----- */
        function renderRelationLink(uid) {
            if (!uid) return "N/A";
            const uids = Array.isArray(uid) ? uid : [uid];
            const links = uids.map(u => {
                const data = membersData.find(x => x.uid === u);
                if (!data) return "N/A";
                return `<span class="relation-link" data-uid="${data.uid}" style="color:#38bdf8; cursor:pointer;">${data.bnName}</span>`;
            });
            return links.join(', ');
        }

        function showProfileByUid(uid) {
            const data = membersData.find(m => m.uid === uid);
            if (!data) return;

            document.getElementById('m-uid').innerText = data.uid;
            document.getElementById('m-bname').innerText = data.bnName;
            document.getElementById('m-ename').innerText = data.enName;
            document.getElementById('m-gender').innerText = data.gender;
            document.getElementById('m-gen').innerText = "পিতৃকুল Gen " + data.patrilinealGen;
            document.getElementById('m-dual-gen').innerText = `পিতৃকুল: Gen ${data.patrilinealGen} | মাতৃকুল: Gen ${data.matrilinealGen}`;
            
            document.getElementById('m-spouse').innerHTML = renderRelationLink(data.spouse);
            document.getElementById('m-father').innerHTML = renderRelationLink(data.father);
            document.getElementById('m-mother').innerHTML = renderRelationLink(data.mother);

            if (data.children && data.children.length > 0) {
                const childLinks = data.children.map(childUid => renderRelationLink(childUid));
                document.getElementById('m-children').innerHTML = childLinks.join(', ');
            } else {
                document.getElementById('m-children').innerText = "N/A";
            }

            const descContainer = document.getElementById('desc-container');
            if (data.description && data.description.trim() !== "") {
                document.getElementById('m-desc').innerText = data.description;
                descContainer.style.display = 'flex';
            } else {
                descContainer.style.display = 'none';
            }

            loadProfilePhoto(document.getElementById('m-photo'), data.uid);

            document.querySelectorAll('#popup-modal .relation-link').forEach(link => {
                link.onclick = (e) => {
                    const targetUid = e.target.getAttribute('data-uid');
                    showProfileByUid(targetUid);
                };
            });

            document.getElementById('popup-modal').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup-modal').style.display = 'none';
        }


        /* ----- SEARCHABLE MEMBER PICKER ----- */
        let sortedMembers = [];
        let highlightedIndex = -1;

        function bengaliNameSort(a, b) {
            const an = (a.bnName || '').trim();
            const bn = (b.bnName || '').trim();
            return an.localeCompare(bn, 'bn', { sensitivity: 'base', numeric: true });
        }

        function populateSelectOptions() {
            const selectEl = document.getElementById('member-select');
            const optionsEl = document.getElementById('member-options');
            sortedMembers = [...membersData].sort(bengaliNameSort);

            selectEl.innerHTML = '<option value="">-- সদস্য নির্বাচন করুন --</option>';
            optionsEl.innerHTML = '';

            sortedMembers.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.uid;
                opt.innerText = `${m.bnName} (${m.nick}) - ${m.uid}`;
                selectEl.appendChild(opt);
            });

            renderMemberOptions(sortedMembers);
        }

        function renderMemberOptions(list) {
            const optionsEl = document.getElementById('member-options');
            optionsEl.innerHTML = '';

            if (!list.length) {
                optionsEl.innerHTML = '<div class="picker-empty">কোনো সদস্য পাওয়া যায়নি</div>';
                return;
            }

            list.forEach((m, index) => {
                const item = document.createElement('div');
                item.className = 'member-option';
                item.setAttribute('role', 'option');
                item.dataset.uid = m.uid;
                item.dataset.index = index;

                const img = document.createElement('img');
                img.className = 'member-option-avatar';
                img.alt = '';
                loadProfilePhoto(img, m.uid);

                const text = document.createElement('div');
                text.className = 'member-option-text';
                text.innerHTML = `<strong>${m.bnName}${m.nick ? ` (${m.nick})` : ''}</strong><small>${m.enName || ''}</small>`;

                const badge = document.createElement('span');
                badge.className = 'member-option-badge';
                badge.textContent = m.uid;

                item.appendChild(img);
                item.appendChild(text);
                item.appendChild(badge);

                item.addEventListener('mousedown', e => {
                    e.preventDefault();
                    selectMember(m.uid);
                });
                optionsEl.appendChild(item);
            });
        }

        function selectMember(uid) {
            const member = membersData.find(m => m.uid === uid);
            if (!member) return;

            const search = document.getElementById('member-search');
            const select = document.getElementById('member-select');
            search.value = `${member.bnName}${member.nick ? ` (${member.nick})` : ''}`;
            select.value = uid;
            document.getElementById('member-options').classList.remove('open');
            search.setAttribute('aria-expanded', 'false');
            document.getElementById('member-clear').style.display = 'block';
            highlightedIndex = -1;
            render2DTreeView();
        }

        function filterMembers(query) {
            const q = query.trim().toLocaleLowerCase('bn-BD');
            if (!q) return sortedMembers;

            return sortedMembers.filter(m => {
                const haystack = [m.bnName, m.enName, m.nick, m.uid].filter(Boolean).join(' ').toLocaleLowerCase('bn-BD');
                return haystack.includes(q);
            });
        }

        function openMemberPicker() {
            const search = document.getElementById('member-search');
            const options = document.getElementById('member-options');
            renderMemberOptions(filterMembers(search.value));
            options.classList.add('open');
            search.setAttribute('aria-expanded', 'true');
        }

        function clearMemberSelection() {
            document.getElementById('member-search').value = '';
            document.getElementById('member-select').value = '';
            document.getElementById('member-clear').style.display = 'none';
            document.getElementById('member-options').classList.remove('open');
            document.getElementById('member-search').setAttribute('aria-expanded', 'false');
            render2DTreeView();
        }

        /* ----- INITIALIZATION & EVENTS ----- */
        document.addEventListener('DOMContentLoaded', () => {
            populateSelectOptions();

            const navToggle = document.getElementById('nav-toggle');
            const navLinks = document.getElementById('nav-links');
            if (navToggle && navLinks) {
                navToggle.addEventListener('click', () => {
                    const open = navLinks.classList.toggle('open');
                    navToggle.setAttribute('aria-expanded', String(open));
                });
                navLinks.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        navLinks.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');
                    });
                });
            }

            const memberSearch = document.getElementById('member-search');
            const memberOptions = document.getElementById('member-options');
            const memberClear = document.getElementById('member-clear');

            memberSearch.addEventListener('focus', openMemberPicker);
            memberSearch.addEventListener('input', () => {
                const filtered = filterMembers(memberSearch.value);
                renderMemberOptions(filtered);
                memberOptions.classList.add('open');
                memberSearch.setAttribute('aria-expanded', 'true');
                memberClear.style.display = memberSearch.value ? 'block' : 'none';
            });
            memberSearch.addEventListener('keydown', e => {
                const items = [...memberOptions.querySelectorAll('.member-option')];
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIndex = Math.max(highlightedIndex - 1, 0);
                } else if (e.key === 'Enter' && highlightedIndex >= 0 && items[highlightedIndex]) {
                    e.preventDefault();
                    selectMember(items[highlightedIndex].dataset.uid);
                    return;
                } else if (e.key === 'Escape') {
                    memberOptions.classList.remove('open');
                    memberSearch.setAttribute('aria-expanded', 'false');
                    return;
                } else {
                    return;
                }
                items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
            });
            memberClear.addEventListener('click', clearMemberSelection);
            document.addEventListener('click', e => {
                if (!e.target.closest('.member-picker')) {
                    memberOptions.classList.remove('open');
                    memberSearch.setAttribute('aria-expanded', 'false');
                }
            });

            document.getElementById('member-select').onchange = render2DTreeView;
            document.getElementById('zoom-in-btn').onclick = () => zoomTree(0.1);
            document.getElementById('zoom-out-btn').onclick = () => zoomTree(-0.1);
            document.getElementById('zoom-reset-btn').onclick = resetZoom;

            document.getElementById('export-png-btn').onclick = exportTreeAsPNG;
            document.getElementById('export-svg-btn').onclick = exportTreeAsSVG;
            document.getElementById('export-pdf-btn').onclick = exportTreeAsPDF;

            document.getElementById('close-popup-btn').onclick = closePopup;
            document.getElementById('image-lightbox').onclick = closeLightbox;
            document.getElementById('m-photo').onclick = function() { openLightbox(this.src); };

            document.getElementById('tree-2d-viewport').addEventListener('scroll', drawSvgConnections);
            window.addEventListener('resize', drawSvgConnections);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeLightbox();
                    closePopup();
                }
            });

            const loadingEl = document.getElementById('app-loading');
            if (loadingEl) {
                loadingEl.style.opacity = '0';
                setTimeout(() => { loadingEl.style.display = 'none'; }, 400);
            }
        });
    </script>
